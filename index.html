  return newCardsPerSession() * lessonDaysCount();
}

// إعادة توزيع تراكم المراجعة: إذا تجاوز عدد البطاقات المستحقة اليوم سقف جلسة
// المراجعة اليومية، تبقى أولوية البطاقات الأقدم استحقاقاً لليوم، وتُوزَّع البقية
// تلقائياً على الأيام القادمة (ضمن أيام المراجعة المفعّلة فقط)، كل يوم بحد أقصى
// يطابق نفس السقف — بدل أن تتراكم كلها على يوم واحد أو يُفرَض عليك تجاوز مدتك.
// تُشغَّل مرة واحدة فقط في أول فتح للتطبيق كل يوم.
function rebalanceReviewLoad(){
  const today = todayStr();
  if (stats.lastRebalanceDate === today) return;
  if (settings.frozenReviewSince) return; // أثناء تجميد المراجعة لا توزيع (الإزاحة تتم عند العودة)
  stats.lastRebalanceDate = today;

  const dailyCap = reviewCardsPerSession();
  if (dailyCap <= 0) return;

  const overdue = getAllCards()
    .filter(c => !c.isNew && c.due <= today)
    .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.order ?? 0) - (b.order ?? 0)));

  if (overdue.length <= dailyCap) return; // لا تراكم يستدعي إعادة توزيع

  const overflow = overdue.slice(dailyCap);
  let day = today;
  let bucketRemaining = 0; // اليوم الحالي امتلأ بالفعل بالسقف، ابدأ من الغد

  for (const c of overflow){
    if (bucketRemaining <= 0){
      do { day = addDays(day, 1); }
      while ((settings.dayTypes || DEFAULT_DAY_TYPES).some(dayHasReview) && !dayHasReview(dayTypeOn(day)));
      bucketRemaining = dailyCap;
    }
    cardMap[c.id].due = day;
    bucketRemaining--;
  }

  saveCards(cardMap);
}

// محاكاة حقيقية (لا تخمين): تُشغّل خوارزمية SM-2 نفسها يوماً بيوم على نسخة منفصلة
// من كل البطاقات، باحترام أيام الدراسة ومدتي جلستي الدرس والمراجعة، لمعرفة متى
// تُدرَس كل البطاقات فعلاً ومتى تصل الإتقان الكامل تقريباً (بافتراض تقييم "متوسط").
function simulateCompletion(opts){
  opts = opts || {};
  const types = settings.dayTypes || DEFAULT_DAY_TYPES;
  if (!types.some(dayHasLesson)) return { noStudyDays:true };

  const perLessonSession = newCardsPerSession();
  const cards = getAllCards().map(c => ({
    isNew:c.isNew, interval:c.interval, repetitions:c.repetitions, ease:c.ease, order:c.order, due:c.due, stab:c.stab, lastDate:c.lastDate,
    unit:c.unit, introDay: c.isNew ? null : 0, stabDay: c.stab ? 0 : null
  }));

  if (perLessonSession === 0 && cards.some(c => c.isNew)){
    return { insufficientLessonTime:true };
  }

  // تستعمل دالة الجدولة الحقيقية نفسها (schedule) بدل نسخة منفصلة من الحساب،
  // فلا يمكن أن تنحرف المحاكاة عن الجلسة الفعلية أبداً.
  const applySim = (c, grade, simDate) => { Object.assign(c, schedule(c, grade, simDate)); };

  let simDate = todayStr();
  let lastIntroducedDay = 0;
  let matureDay = null;
  const overloadDayIndices = [];
  const MAX_DAYS = 365 * 3;

  for (let day = 0; day < MAX_DAYS; day++){
    const type = dayTypeOn(simDate);
    // الجلسات المنجزة أو المجمَّدة اليوم لا تُحتسب مرة ثانية في اليوم الأول من المحاكاة
    const reviewOpen = dayHasReview(type) && !(day === 0 && settings.frozenReviewSince);
    const lessonOpen = dayHasLesson(type) && !(day === 0 && settings.frozenLessonSince);

    if (reviewOpen){
      const perReviewSession = day === 0 ? reviewRemainingToday() : reviewCardsPerSession(simDate);
      // الأقدم استحقاقاً أولاً، كالجلسة الحقيقية
      const dueReview = cards.filter(c => !c.isNew && c.due <= simDate)
        .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.order ?? 0) - (b.order ?? 0)));
      if (dueReview.length > perReviewSession) overloadDayIndices.push(day);
      const toReview = dueReview.slice(0, perReviewSession);
      for (const c of toReview){ const had = !!c.stab; applySim(c, 2, simDate); if (!had && c.stab && c.stabDay === null) c.stabDay = day; } // المحاكاة تفترض تقييم "جيد"
    }

    if (lessonOpen){
      // جلسة درس واحدة في اليوم، قراءة بلا تقييم: البطاقة تعود لأول مراجعة غداً (أو أقرب يوم مراجعة)
      const newPool = newCardOrder(cards.filter(c => c.isNew), opts.extraExamId); // دالة ترتيب الجلسة نفسها
      const toIntroduce = newPool.slice(0, day === 0 ? lessonRemainingToday() : newCardsPerSession(simDate));
      for (const c of toIntroduce){ c.isNew = false; c.due = nextAllowedDay(addDays(simDate, 1)); c.introDay = day; lastIntroducedDay = day; }
    }

    // نُسجّل أول نضج كامل، لكن نُكمل المحاكاة إلى نهاية الأفق الزمني (حتى 3 سنوات)
    // لمعرفة متى يستقر العبء اليومي فعلياً على المدى البعيد، لا عند أول نضج فقط.
    if (matureDay === null && !cards.some(c => c.isNew) && cards.every(c => !!c.stab)){
      matureDay = day;
      if (opts.stopAtMature) break; // لاقتراح المدة يكفي معرفة يوم الرسوخ
    }
    simDate = addDays(simDate, 1);
  }

  // ازدحام طبيعي أثناء إدخال البطاقات الجديدة أمر متوقع تماماً ولا يستحق تنبيهاً.
  // التنبيه الحقيقي هو إن استمر التكدس حتى بعد انتهاء إدخال كل البطاقات الجديدة.
  const chronicOverloadDays = overloadDayIndices.filter(d => d > lastIntroducedDay).length;
  const lastOverloadDay = overloadDayIndices.length ? overloadDayIndices[overloadDayIndices.length - 1] : null;
  // "يستقر العبء" إن لم يتكرر التجاوز لاحقاً بشكل ملحوظ حتى نهاية أفق المحاكاة
  const stabilizesDate = lastOverloadDay !== null ? addDays(todayStr(), lastOverloadDay) : null;
  const staysHeavyUntilEnd = lastOverloadDay !== null && (MAX_DAYS - lastOverloadDay) < 90;

  // لكل درس: يوم اكتمال قراءة بطاقاته ويوم رسوخ آخرها (null إن لم يتمّ داخل أفق المحاكاة)
  let unitFinish = null, unitMature = null;
  if (opts.trackUnits){
    unitFinish = {}; unitMature = {};
    cards.forEach(c => {
      const u = c.unit;
      if (!(u in unitFinish)){ unitFinish[u] = 0; unitMature[u] = 0; }
      if (unitFinish[u] !== null) unitFinish[u] = c.introDay === null ? null : Math.max(unitFinish[u], c.introDay);
      if (unitMature[u] !== null) unitMature[u] = c.stabDay === null ? null : Math.max(unitMature[u], c.stabDay);
    });
  }
  return {
    unitFinish, unitMature,
    newCardsPerWeek: weeklyCap(),
    introducedAllDate: addDays(todayStr(), lastIntroducedDay),
    matureDate: matureDay !== null ? addDays(todayStr(), matureDay) : null,
    reachedLimit: matureDay === null,
    overloaded: chronicOverloadDays > 5, // تكدس حقيقي مستمر بعد انتهاء إدخال كل البطاقات الجديدة
    stabilizesDate,       // التاريخ الذي يستقر بعده العبء اليومي فعلياً (إن وُجد ازدحام أصلاً)
    staysHeavyUntilEnd,   // إن كان العبء لا يزال ثقيلاً حتى قرب نهاية أفق 3 سنوات (مشكلة دائمة فعلاً)
  };
}

// البطاقات المستحقة فعلاً للدراسة الآن: كل البطاقات القديمة المستحقة + حصة محدودة
// من البطاقات الجديدة هذا الأسبوع (وليس كل البطاقات الجديدة دفعة واحدة).
// إذا تراكمت المراجعات كثيراً، نقلّل البطاقات الجديدة تلقائياً ونوضّح السبب.
function getDueBreakdown(unitId){
  const today = todayStr();
  let pool = getAllCards();
  if (unitId) pool = pool.filter(c => c.unit === unitId);

  const reviewDue = pool.filter(c => !c.isNew && c.due <= today);
  const newDue = newCardOrder(pool.filter(c => c.isNew && c.due <= today));

  // جلسة درس واحدة في اليوم، فقط في أيام "درس + مراجعة" وغير مجمَّدة؛ وجلسة مراجعة واحدة في أيام المراجعة
  const lessonBlock = lessonBlockReason();
  const reviewBlock = reviewBlockReason();
  // ما بقي من حصة اليوم فقط (يُخصم منه ما أُنجز إن توقفت الجلسة ثم استؤنفت)
  const cap = lessonBlock ? 0 : lessonRemainingToday();
  // الأقدم استحقاقاً أولاً؛ ولا يُرفع السقف لأجل المتراكم
  reviewDue.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.order ?? 0) - (b.order ?? 0)));
  const finalExtras = reviewBlock ? [] : finalReviewExtras(pool);
  const allowedReview = reviewBlock ? [] : [...reviewDue, ...finalExtras].slice(0, reviewRemainingToday());
  const finalIds = new Set(finalExtras.map(c => c.id));

  const allowedNew = newDue.slice(0, cap);
  return { reviewDue, allowedReview, allowedNew, adaptiveReduced:false, lessonBlock, reviewBlock, finalExtras, finalIds };
}

function getStudyQueue(unitId){
  const { reviewDue, allowedNew } = getDueBreakdown(unitId);
  return [...reviewDue, ...allowedNew].sort((a, b) => {
    if (a.unit !== b.unit) return a.unit - b.unit;
    return (a.order ?? 0) - (b.order ?? 0);
  });
}
function getUnitStats(){
  const stats = {};
  const t = todayStr();
  for (const c of getAllCards()){
    if (!stats[c.unit]) stats[c.unit] = { total:0, reviewDue:0, newDue:0, learned:0 };
    stats[c.unit].total += 1;
    if (c.due <= t){
      if (c.isNew) stats[c.unit].newDue += 1;
      else stats[c.unit].reviewDue += 1;
    }
    if (!c.isNew) stats[c.unit].learned += 1;
  }
  return stats;
}

function switchTab(tab){
  view = tab; activeUnit = null; queue = []; qIndex = 0; flipped = false;
  noteEd = null; editingId = null;
  if (tab === "guide" && !settings.guideSeen){ settings.guideSeen = true; saveSettings(settings); }
  stopSessionTimer();
  render();
}

function openUnit(unitId){
  activeUnit = unitId; view = "unitDetail"; expandedIds.clear();
  render();
}

function toggleCardItem(id){
  if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
  render();
}

function backToLessons(){
  activeUnit = null; view = "lessons"; render();
}

/* ---------- المؤقّت ----------
   يعدّ الوقت النشط فقط: يتوقف بعد 90 ثانية بلا لمس، ويتوقف والتطبيق مخفي، ويعود بأول لمسة.
   ما استُهلك من جلسة اليوم يُحفظ، فإن توقفت الجلسة ثم استؤنفت أكمل العدّ من حيث انتهى.
   العدّ تنازلي من مدة الجلسة، للعرض: الحصة نفسها تُحدَّد بعدد البطاقات المشتق من المدة. */
const IDLE_LIMIT_MS = 90000;
const IDLE_TEXT = "توقّف المؤقت لأن الشاشة بقيت 90 ثانيةً بلا لمس. بلمسها يعود إلى العمل.";
let lastInteractAt = Date.now();
let sessionActiveSec = 0; // الوقت النشط في هذه الجلسة منذ فتحها الآن
function timerIsIdle(){ return document.hidden || (Date.now() - lastInteractAt) >= IDLE_LIMIT_MS; }
function markActive(){ const wasIdle = timerIsIdle(); lastInteractAt = Date.now(); if (wasIdle && sessionStartTime) tickSessionTimer(true); }
function timerKey(mode){ return mode === "new" ? "lesson" : "review"; }
function usedSecToday(mode){ const k = timerKey(mode); return stats[k + "SecDate"] === todayStr() ? (stats[k + "Sec"] || 0) : 0; }
function addUsedSec(mode){
  const k = timerKey(mode), t = todayStr();
  if (stats[k + "SecDate"] !== t){ stats[k + "SecDate"] = t; stats[k + "Sec"] = 0; }
  stats[k + "Sec"] += 1;
}
function sessionBudgetSec(mode){ return effectiveMinutes(mode === "new" ? "lessonMinutes" : "reviewMinutes") * 60; }
function mmss(sec){ return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }
function timerDisplay(){
  const idle = timerIsIdle();
  const remain = Math.max(0, sessionBudgetSec(sessionMode) - usedSecToday(sessionMode));
  const note = idle ? IDLE_TEXT : (remain === 0 ? "⏰ انتهى الوقت المقدَّر للجلسة. الحصة تُحدَّد بعدد البطاقات، فما بقي منها يُكمَل بلا عجلة." : "");
  return { text: (idle ? "⏸ " : "") + mmss(remain), note };
}
function startSessionTimer(){
  sessionStartTime = Date.now();
  sessionActiveSec = 0;
  lastInteractAt = Date.now();
  if (sessionTimerHandle) clearInterval(sessionTimerHandle);
  sessionTimerHandle = setInterval(tickSessionTimer, 1000);
  tickSessionTimer(true);
}
function stopSessionTimer(){
  if (sessionTimerHandle){ clearInterval(sessionTimerHandle); sessionTimerHandle = null; }
  if (sessionStartTime) saveStats(stats);
  sessionStartTime = null;
}
function tickSessionTimer(displayOnly){
  if (!sessionStartTime) return;
  if (displayOnly !== true && !timerIsIdle()){
    sessionActiveSec += 1;
    addUsedSec(sessionMode);
    if (sessionActiveSec % 5 === 0) saveStats(stats);
  }
  const d = timerDisplay();
  const el = document.getElementById("sessionTimer");
  if (el) el.textContent = d.text;
  const noteEl = document.getElementById("timerNote");
  if (noteEl){ noteEl.textContent = d.note; noteEl.style.display = d.note ? "" : "none"; }
}
["pointerdown", "keydown", "touchstart"].forEach(evt => document.addEventListener(evt, markActive, { passive:true }));
document.addEventListener("visibilitychange", () => { if (document.hidden) lastInteractAt = 0; if (sessionStartTime) tickSessionTimer(true); });

function buildQueue(cards){
  return [...cards].sort((a, b) => {
    if (a.unit !== b.unit) return a.unit - b.unit;
    return (a.order ?? 0) - (b.order ?? 0);
  });
}

// جلسة الدرس: بطاقات جديدة فقط (لم تُدرَس من قبل) — منفصلة تماماً عن المراجعة
function startNewLesson(unitId){
  const { allowedNew } = getDueBreakdown(unitId);
  queue = buildQueue(allowedNew);
  qIndex = 0; flipped = false; sessionDone = 0; sessionMode = "new";
  view = "review";
  sessionHandled = new Set(); sessionFinal = new Set(); sessionRequeued = {};
  if (queue.length > 0){ bumpLessonSession(); startSessionTimer(); }
  render();
}

// المراجعة اليومية: بطاقات سبق تعلّمها وحان موعد تكرارها، بمقدار يطابق مدة
// جلسة المراجعة التي حددتها فعلياً — لا الاستحقاق الكامل دفعة واحدة.
function startDailyReview(unitId){
  const { allowedReview, finalIds } = getDueBreakdown(unitId);
  queue = [...allowedReview]; // الأقدم استحقاقاً أولاً، ثم بطاقات المراجعة الختامية
  qIndex = 0; flipped = false; sessionDone = 0; sessionMode = "review";
  view = "review";
  sessionHandled = new Set(); sessionFinal = new Set([...finalIds].filter(id => queue.some(c => c.id === id))); sessionRequeued = {};
  if (queue.length > 0) startSessionTimer();
  render();
}

let toastTimer = null;
function showToast(msg){
  toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast = null; render(); }, 1600);
}

// الدرس (البطاقات الجديدة) قراءة وتعرّف فقط، بلا أي تقييم SM-2 — تصبح البطاقة مستحقة لأول مراجعة فعلية،
// وهناك فقط (في جلسة المراجعة) يبدأ الجدولة الحقيقية. انظر answerCard أدناه للمراجعة المقيَّمة فعلاً.
let sessionHandled = new Set(); // مواضع (لا معرّفات) أُنجزت في الجلسة، لأن البطاقة المعادة في الختامية تظهر مرة ثانية بموضع جديد
let sessionFinal = new Set();   // بطاقات المراجعة الختامية في هذه الجلسة
let sessionRequeued = {}; // بطاقات أُنجزت في هذه الجلسة: الرجوع إليها بزر "السابق" للاطلاع فقط، بلا احتساب ثانٍ
function continueNewCard(){
  const current = queue[qIndex];
  if (sessionHandled.has(qIndex)){ goNext(); return; }
  sessionHandled.add(qIndex);
  countLessonCard();
  // ما قُرئ اليوم لا يظهر في مراجعة اليوم أبداً: أول مراجعة له غداً (أو أقرب يوم مراجعة إن كان الغد عطلة)
  cardMap[current.id] = { ...cardMap[current.id], isNew:false, readOn: todayStr(), due: nextAllowedDay(addDays(todayStr(), 1)) };
  touchStreak();
  bumpNewIntroduced();
  sessionDone += 1; flipped = false;
  if (qIndex + 1 < queue.length){ qIndex += 1; }
  else { view = "done"; lastSessionElapsedSec = sessionActiveSec; stopSessionTimer(); }
  render();
  saveCards(cardMap);
  saveStats(stats);
}

// المراجعة الختامية: تسجّل النجاح أو الإتقان أو فقدانه فقط، ولا تستدعي SM-2 ولا تغيّر الموعد المحفوظ؛ و«إعادة» تعيدها في الجلسة نفسها
function answerFinalCard(current, grade){
  const t = todayStr();
  const c = { ...cardMap[current.id] };
  if (grade >= 1){
    const prev = c.lastSeen || c.lastDate;
    if (!c.stab && prev && daysBetween(prev, t) >= STABLE_GAP_SH) c.stab = t;
    c.lastOk = t;
  } else {
    c.stab = null;
    if ((sessionRequeued[current.id] || 0) < 2){ sessionRequeued[current.id] = (sessionRequeued[current.id] || 0) + 1; queue.push(current); }
  }
  c.lastSeen = t;
  cardMap[current.id] = c;
  touchStreak();
  sessionDone += 1; flipped = false;
  if (qIndex + 1 < queue.length){ qIndex += 1; }
  else { view = "done"; lastSessionElapsedSec = sessionActiveSec; stopSessionTimer(); }
  showToast(grade >= 1 ? "نجاح في المراجعة الختامية — موعدها المحفوظ كما هو." : "تُعاد في هذه الجلسة نفسها — موعدها المحفوظ كما هو.");
  render();
  saveCards(cardMap);
  saveStats(stats);
}
function answerCard(grade){
  const current = queue[qIndex];
  if (sessionHandled.has(qIndex)){ goNext(); return; }
  sessionHandled.add(qIndex);
  countReviewCard();
  if (sessionFinal.has(current.id)){ answerFinalCard(current, grade); return; }
  const wasNew = current.isNew;
  cardMap[current.id] = schedule(cardMap[current.id], grade);
  bumpStats();
  if (wasNew) bumpNewIntroduced();
  sessionDone += 1; flipped = false;
  if (qIndex + 1 < queue.length){ qIndex += 1; }
  else { view = "done"; lastSessionElapsedSec = sessionActiveSec; stopSessionTimer(); }

  showToast(randomGradeToast(grade, cardMap[current.id].due));

  // حدّث الشاشة فوراً؛ الحفظ يجري في الخلفية دون انتظار
  render();
  saveCards(cardMap);
  saveStats(stats);
}

function esc(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* ============================================================
   العرض (Render)
   ============================================================ */
function render(){
  document.body.classList.toggle("dark", !!settings.darkMode);

  let headerHTML = `
    <div class="header">

        <button class="dark-toggle-btn" onclick="toggleDarkMode()" aria-label="تبديل الوضع الداكن">${settings.darkMode ? "☀️" : "🌙"}</button>

  let bodyHTML = "";
  if (view === "home") bodyHTML = renderHome();
  else if (view === "lessons") bodyHTML = renderLessons();
  else if (view === "unitDetail") bodyHTML = renderUnitDetail();
  else if (view === "review") bodyHTML = renderReview();
  else if (view === "done") bodyHTML = renderDone();
  else if (view === "settings") bodyHTML = renderSettings();
  else if (view === "notebook") bodyHTML = renderNotebook();
  else if (view === "guide") bodyHTML = renderGuide();

  const tabbarHTML = `
    <div class="tabbar">
      <button class="tab-btn ${view === "home" ? "active" : ""}" onclick="switchTab('home')">
        <span class="tab-icon">🏠</span>الرئيسية
      </button>
      <button class="tab-btn ${(view === "lessons" || view === "unitDetail") ? "active" : ""}" onclick="switchTab('lessons')">
        <span class="tab-icon">📚</span>الدروس
      </button>
      <button class="tab-btn ${(view === "review" || view === "done") ? "active" : ""}" onclick="switchTab('review')">
        <span class="tab-icon">🔁</span>المراجعة
      </button>
      <button class="tab-btn ${view === "notebook" ? "active" : ""}" onclick="switchTab('notebook')">
        <span class="tab-icon">📓</span>الدفتر
      </button>
      <button class="tab-btn ${(view === "settings" || view === "guide") ? "active" : ""}" onclick="switchTab('settings')">
        <span class="tab-icon">⚙️</span>الإعدادات
      </button>
    </div>
  `;

  const toastHTML = toast ? `<div class="toast">${esc(toast)}</div>` : "";

  root.innerHTML = headerHTML + `<div class="page-with-tabbar">` + bodyHTML + `</div>` + toastHTML + tabbarHTML + noteOverlayHtml();
}


/* سطر واحد هادئ للبدء: الدليل ونوع الدراسة معاً، ويختفي كلٌّ منهما حين يُنجَز */
function setupLineHtml(){
  const parts = [];
  if (!settings.guideSeen) parts.push(`<a href="#" onclick="switchTab('guide');return false;" style="color:inherit;font-weight:800;">❓ دليل الاستخدام</a>`);
  if (settings.studentType === null) parts.push(`<a href="#" onclick="switchTab('settings');return false;" style="color:inherit;font-weight:800;">🏫 تحديد نوع الدراسة</a>`);
  return parts.length ? `<div class="footer-note" style="margin:0 0 12px;text-align:right;">👋 للبدء: ${parts.join(" · ")}</div>` : "";
}
function schoolHomeLineHtml(){
  if (settings.studentType === null) return "";
  if (settings.studentType !== "school") return "";
  const t = todayStr();
  const ex = schoolExamsSorted().find(e => e.date >= t);
  if (!ex) return "";
  const sim = schoolSim(null);
  let st = "";
  if (sim && sim.unitFinish){
    const ev = evaluateSchoolExam(ex, sim);
    st = ev.alreadyAll ? " — ✅ دروسه مقروءة وراسخة" : ev.finishOk ? (ev.matureOk ? " — ✅ تكتمل قراءة دروسه ورسوخها قبله" : " — ✅ تكتمل قراءة دروسه قبله، ورسوخها بعده (التفاصيل في الإعدادات)") : " — ⚠️ لا تكتمل قراءة دروسه قبله (الحل في الإعدادات)";
  }
  return `<div class="footer-note" style="margin:0 0 12px;text-align:right;">📝 أقرب موعد: ${esc(schoolExamTitle(ex))} ${daysLeftPhraseAr(ex.date)} (${formatDateArabic(ex.date)})${ex.prioritized ? " · ⏫ دروسه مقدَّمة" : ""}${st}</div>`;
}
function examLineHtml(){
  if (!settings.examDate) return "";
  const t = todayStr(), left = daysBetween(t, settings.examDate);
  if (left < 0) return `<div class="footer-note" style="margin:0 0 12px;text-align:right;">🎓 موعد الامتحان المسجَّل (${formatDateArabic(settings.examDate)}) قد مضى — تحديثه أو مسحه من الإعدادات.</div>`;
  if (left === 0) return `<div class="footer-note" style="margin:0 0 12px;text-align:right;">🎓 الامتحان <strong>اليوم</strong> — وفّق الله الجميع.</div>`;
  let s = `🎓 الامتحان بعد ${left === 1 ? "يوم واحد" : left === 2 ? "يومين" : left + (left <= 10 ? " أيام" : " يوماً")} (${formatDateArabic(settings.examDate)})`;
  if (left <= EXAM_WINDOW){
    const all = getAllCards(), ready = all.filter(isExamReady).length;
    s += ` · الجاهزة الآن: ${ready} من ${all.length} (${Math.floor(all.length ? ready * 100 / all.length : 0)}٪)`;
    if (finalReviewActive()) s += `<br>🎯 المراجعة الختامية مفعّلة: ستظهر في المراجعة بطاقات قديمة لم يحن موعدها، وهي مقصودة.`;
  }
  const sg = reviewMinutesSuggestion();
  if (sg && sg.status === "suggest") s += `<br>💡 الرسوخ التقديري يقع بعد الامتحان؛ أقل مدة مراجعة تكفي: ${sg.minutes} دقيقة (التفاصيل في الإعدادات).`;
  else if (sg && (sg.status === "over60" || sg.status === "nature")) s += `<br>💡 الرسوخ التقديري يقع بعد الامتحان — السبب والحل في الإعدادات.`;
  return `<div class="footer-note" style="margin:0 0 12px;text-align:right;">${s}</div>`;
}
// بطاقتا جلستي اليوم (المراجعة ثم الدرس) — مصدر واحد للرئيسية وتبويب المراجعة، يحترم نوع اليوم والتجميد والسقف اليومي
function frozenDaysLabel(since){
  const n = Math.max(0, daysBetween(since, todayStr()));
  return n === 0 ? "اليوم" : (n === 1 ? "يوم واحد" : (n === 2 ? "يومين" : `${n} ${n <= 10 ? "أيام" : "يوماً"}`));
}
function sessionSectionsHtml(){
  const { reviewDue, allowedReview, allowedNew, adaptiveReduced, lessonBlock, reviewBlock } = getDueBreakdown(null);
  const today = todayStr();
  const type = dayTypeOn(today);
  const lightNote = isLightModeOn() ? `<div class="footer-note" style="margin-top:8px;">🌤️ الوضع الخفيف مفعّل حتى ${formatDateArabic(settings.lightModeUntil)} — جلسة الدرس بنصف المدة، والمراجعة كما هي.</div>` : "";
  let html = `<div class="footer-note" style="margin:0 0 12px;text-align:right;">📅 اليوم (${WEEKDAY_NAMES[weekdayOf(today)]}): <strong>${DAY_TYPE_LABEL[type]}</strong></div>` + examLineHtml() + schoolHomeLineHtml();

  // --- المراجعة ---
  html += `<div class="section-title">🔁 جلسة المراجعة</div><div class="hero-card small">`;
  if (reviewBlock === "frozen"){
    html += `<div class="hero-label">🧊 المراجعة مجمَّدة منذ ${frozenDaysLabel(settings.frozenReviewSince)}</div>
      <div class="hero-caption" style="margin-top:6px;">لا تتراكم المواعيد أثناء التجميد؛ تُزاح بعدد أيام الغياب عند العودة. وما يُقرأ في الدرس أثناء تجميد المراجعة تبدأ مراجعته في اليوم التالي للعودة، ولا يُزاح بعدد أيام التجميد.</div>
      <button class="start-btn" onclick="endFreeze('review')">استئناف المراجعة الآن</button>`;
  } else if (reviewBlock === "holiday"){
    html += `<div class="hero-caption">🌴 يوم عطلة — لا مراجعة اليوم. المراجعة القادمة ${nextDayLabel(["review","both"])}.</div>`;
  } else if (reviewBlock === "done" || (reviewUsedToday() > 0 && allowedReview.length === 0)){
    html += `<div class="hero-caption">✅ اكتملت مراجعة اليوم (جلسة واحدة في اليوم، سقف ثابت). القادمة ${nextDayLabel(["review","both"])}.</div>`;
  } else {
    const newlyRead = getAllCards().filter(c => !c.isNew && !c.lastDate && c.due > today).length;
    const finalInSession = allowedReview.filter(c => c.due > today).length;
    html += `<div class="hero-number">${allowedReview.length}</div>
      <div class="hero-caption">
        ${allowedReview.length === 0 ? (newlyRead > 0 ? "لا مستحق الآن — ما قُرئ في الدرس يعود في أول يوم مراجعة بعده" : "لا توجد مراجعات مستحقة الآن") : (reviewUsedToday() > 0 ? `بطاقة متبقية من جلسة اليوم (أُنجز منها ${reviewUsedToday()})` : `بطاقة تناسب مدة الجلسة (${effectiveMinutes("reviewMinutes")} د)`)}
        ${reviewDue.length > allowedReview.length ? `<br><span style="color:var(--gold);">+ ${reviewDue.length - allowedReview.length} أخرى تنتظر دورها بمواعيدها، الأقدم استحقاقاً أولاً</span>` : ""}
        ${finalInSession ? `<br><span>🎯 منها ${finalInSession} من المراجعة الختامية (بعد المستحق)</span>` : ""}
      </div>
      <button class="start-btn" ${allowedReview.length === 0 ? "disabled" : ""} onclick="startDailyReview(null)">${reviewUsedToday() > 0 ? "متابعة جلسة المراجعة" : "بدء جلسة المراجعة"}</button>`;
  }
  html += `</div>`;

  // --- الدرس ---
  html += `<div class="section-title">📘 جلسة الدرس</div><div class="hero-card small">`;
  if (lessonBlock === "frozen"){
    html += `<div class="hero-label">🧊 الدرس مجمَّد منذ ${frozenDaysLabel(settings.frozenLessonSince)}</div>
      <div class="hero-caption" style="margin-top:6px;">المراجعة تسير عادياً إن لم تكن مجمَّدة، ولا شيء من الدرس يتراكم.</div>
      <button class="start-btn" onclick="endFreeze('lesson')">استئناف الدرس الآن</button>`;
  } else if (lessonBlock === "holiday" || lessonBlock === "reviewOnlyDay"){
    html += `<div class="hero-caption">${lessonBlock === "holiday" ? "🌴 يوم عطلة." : "اليوم يوم مراجعة فقط."} الدرس القادم ${nextDayLabel(["both"])}.</div>`;
  } else if (lessonBlock === "done"){
    html += `<div class="hero-caption">✅ جلسة الدرس لهذا اليوم أُنجزت (جلسة درس واحدة في اليوم). الدرس القادم ${nextDayLabel(["both"])}.</div>`;
  } else {
    html += `<div class="hero-number">${allowedNew.length}</div>
      <div class="hero-caption">${allowedNew.length === 0 ? "لا توجد بطاقات جديدة متاحة" : (lessonUsedToday() > 0 ? `بطاقة متبقية من جلسة اليوم (قُرئ منها ${lessonUsedToday()})` : `بطاقة جديدة للقراءة والتعرّف (${effectiveMinutes("lessonMinutes")} د)`) + ` — أول مراجعة لها ${nextDayLabel(["review","both"])}`}</div>
      <button class="start-btn" ${allowedNew.length === 0 ? "disabled" : ""} onclick="startNewLesson(null)">${lessonUsedToday() > 0 ? "متابعة جلسة الدرس" : "بدء جلسة الدرس"}</button>`;
  }
  html += `</div>` + lightNote;
  return html;
}
function renderHome(){
  const allCards = getAllCards();
  const totalCount = allCards.length;
  const masteredCount = allCards.filter(c => !!c.stab).length;
  const pct = totalCount ? Math.round((allCards.filter(c => !c.isNew).length / totalCount) * 100) : 0;

  // التجميد الكامل (الدرس والمراجعة معاً): شاشة التجميد وحدها
  if (settings.frozenLessonSince && settings.frozenReviewSince){
    const since = settings.frozenLessonSince < settings.frozenReviewSince ? settings.frozenLessonSince : settings.frozenReviewSince;

      <div class="container">
        <div class="hero-card">
          <div class="hero-label">🧊 التطبيق مجمَّد بالكامل</div>

  const absenceMessage = isRepeatOffense
    ? `هذا الانقطاع رقم ${recentMissed} خلال آخر 30 يوماً دون تجميد مُعلَن (${unplannedScheduledMissed} من أيام الدراسة). الانتظام هو ما يحفظ العلم من النسيان، والأفضل في المرة القادمة تفعيل التجميد قبل الانقطاع لا بعده.`
    : `فات ${unplannedScheduledMissed === 1 ? "يوم دراسة واحد" : (unplannedScheduledMissed === 2 ? "يوما دراسة" : unplannedScheduledMissed + " أيام دراسة")} منذ آخر زيارة. إزاحة المواعيد بنفس المدة تمنع التراكم بضغطة واحدة.`;

  const absenceBanner = unplannedGap > 0 ? `
    <div class="hero-card" style="margin-bottom:14px;border-color:var(--gold);">

      <div style="display:flex;gap:8px;margin-top:14px;">

        <button class="start-btn" style="flex:1;padding:10px;" onclick="shiftForUnplannedAbsence()">إزاحة المواعيد</button>
      </div>
    </div>
  ` : "";

  const quoteCard = `<div class="quote-card"><div class="quote-text">${esc(getTodayQuote())}</div></div>`;

  return `
    <div class="container">
      ${quoteCard}
      ${setupLineHtml()}
      ${absenceBanner}
      ${sessionSectionsHtml()}

      <div class="section-title">إنجازاتي</div>
      <div class="achieve-grid">
        <div class="achieve-card">
          <div class="achieve-icon">🔥</div>
          <div class="achieve-num">${stats.streak}</div>
          <div class="achieve-label">يوم متتالي</div>
        </div>
        <div class="achieve-card">
          <div class="achieve-icon">📖</div>
          <div class="achieve-num">${stats.totalReviews}</div>
          <div class="achieve-label">مراجعة كلية</div>
        </div>
        <div class="achieve-card">
          <div class="achieve-icon">⭐</div>
          <div class="achieve-num">${masteredCount}</div>
          <div class="achieve-label">بطاقة متقنة</div>
        </div>
        <div class="achieve-card">
          <div class="achieve-icon">🎯</div>
          <div class="achieve-num">${pct}%</div>
          <div class="achieve-label">من المنهج تمت مراجعته</div>
        </div>
        ${settings.examDate ? `<div class="achieve-card">
          <div class="achieve-icon">🎓</div>
          <div class="achieve-num">${allCards.filter(isExamReady).length}</div>
          <div class="achieve-label">جاهزة للامتحان (تُحسب في آخر 30 يوماً)</div>

function renderLessons(){
  const stats2 = getUnitStats();
  const units = Object.keys(stats2).map(Number).sort((a,b) => a - b);

  let rows = units.map(u => {
    const s = stats2[u];
    const pct = Math.round((s.learned / s.total) * 100);
    const name = unitNameOf(u);
    return `
      <div class="unit-row" onclick="openUnit(${u})">
        <div class="unit-row-top">
          <span class="unit-name">${esc(name)}</span>
          <span class="unit-count">${s.learned}/${s.total}${(s.reviewDue + s.newDue) > 0 ? ` <span class="unit-due-badge">· ${[s.reviewDue > 0 ? `${s.reviewDue} مراجعة` : "", s.newDue > 0 ? `${s.newDue} جديدة` : ""].filter(Boolean).join(" + ")}</span>` : ""} <span class="unit-row-arrow">←</span></span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join("");

  return `
    <div class="container">
      <div class="section-title">الدروس (${units.length})</div>
      <div class="unit-list">${rows}</div>
    </div>
  `;
}

    .filter(c => c.unit === u)

          <div class="card-tools-row" style="margin:8px 0 0;justify-content:flex-start;"><button class="tool-btn" onclick="event.stopPropagation(); openNoteFromCard('${c.id}')">📝 تدوين ملاحظة</button><button class="tool-btn" onclick="event.stopPropagation(); openCardEdit('${c.id}')">✏️ تعديل</button></div>` : ""}

          ${txt(card,"ctx") ? `<div class="card-ctx">استُشهد بها في: ${esc(txt(card,"ctx"))}</div>` : ""}

          <div class="tap-hint">${rev ? "الضغط هنا يكشف السؤال" : "الضغط هنا يكشف الإجابة"}</div>

      <div class="card-tools-row">

function formatDateArabic(dateStr){
  const months = ["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// البديل المعتمد عن الإدخال التكيّفي: حين تُظهر المحاكاة أن الرسوخ يقع بعد الامتحان،
// يُقترح أقل مدة مراجعة يومية تكفي (مضاعفات 5 دقائق حتى 60)، وإن لم تكفِ أي مدة لأن آخر البطاقات
// تحتاج بطبيعتها أسابيع لترسخ، يُذكر ذلك سبباً بدل الاقتراح. المحاكاة تفترض تقييم "جيد" منتظماً.
let _suggestCache = { key:null, val:null };
function reviewMinutesSuggestion(){
  if (!settings.examDate || todayStr() >= settings.examDate) return null;
  const key = [todayStr(), JSON.stringify(settings), stats.lessonDoneDate, stats.lessonDoneCount, stats.reviewDoneDate, stats.reviewDoneCount, getAllCards().filter(c => !c.isNew).length, stats.totalReviews].join("|");
  if (_suggestCache.key === key) return _suggestCache.val;
  const exam = settings.examDate, cur = settings.reviewMinutes;
  const run = m => { settings.reviewMinutes = m; const r = simulateCompletion({stopAtMature:true}); return r; };
  let val;
  try {
    const base = run(cur);
    if (base.noStudyDays || base.insufficientLessonTime){ val = null; }
    else if (base.matureDate && base.matureDate <= exam){ val = { status:"ok", date: base.matureDate }; }
    else {
      let found = null;
      for (let m = 5; m <= 60; m += 5){ if (m <= cur) continue; const r = run(m); if (r.matureDate && r.matureDate <= exam){ found = { m, date: r.matureDate }; break; } }
      if (found) val = { status:"suggest", minutes: found.m, date: found.date, current: base.matureDate };
      else {
        const unlimited = run(600);
        val = (unlimited.matureDate && unlimited.matureDate <= exam)
          ? { status:"over60", current: base.matureDate }
          : { status:"nature", lastIntro: unlimited.introducedAllDate, current: base.matureDate };
      }
    }
  } finally { settings.reviewMinutes = cur; }
  _suggestCache = { key, val };
  return val;
}
function suggestionHtml(){
  const s = reviewMinutesSuggestion();
  if (!s) return "";
  if (s.status === "ok") return `<div class="footer-note" style="margin-top:8px;text-align:right;">✅ بالمدة الحالية يقع الرسوخ التقديري (${formatDateArabic(s.date)}) قبل الامتحان.</div>`;
  if (s.status === "suggest") return `<div class="footer-note" style="margin-top:8px;text-align:right;color:var(--gold);">💡 بالمدة الحالية يقع الرسوخ ${s.current ? "في " + formatDateArabic(s.current) : "بعد أفق المحاكاة"}، أي بعد الامتحان. أقل مدة مراجعة يومية تكفي: <strong>${s.minutes} دقيقة</strong> (الرسوخ التقديري ${formatDateArabic(s.date)}).</div>`;
  if (s.status === "over60") return `<div class="footer-note" style="margin-top:8px;text-align:right;color:var(--gold);">💡 الرسوخ يقع بعد الامتحان، وحتى 60 دقيقة مراجعة يومية لا تكفي لتقديمه. زيادة مدة الدرس أو أيامه تُدخل البطاقات أبكر فتترك لها وقتاً أطول.</div>`;
  return `<div class="footer-note" style="margin-top:8px;text-align:right;color:var(--gold);">💡 الرسوخ يقع بعد الامتحان لسبب لا تعالجه مدة المراجعة: آخر البطاقات تُقرأ ${s.lastIntro ? "في " + formatDateArabic(s.lastIntro) : "متأخرة"}، والبطاقة تحتاج بطبيعتها نحو 3 إلى 4 أسابيع من التذكّر الناجح لترسخ (فاصل حقيقي 14 يوماً). ما يقدّم الرسوخ هو تقديم الدرس: زيادة مدة جلسة الدرس أو أيام "درس + مراجعة".</div>`;
}
function renderCompletionEstimate(){

  if (result.noStudyDays){
    return `<div class="footer-note" style="color:var(--hard);margin-bottom:16px;">لا يمكن حساب موعد الإنجاز لأن الجدول لا يحوي أي يوم "درس + مراجعة".</div>`;
  }
  if (result.insufficientLessonTime){
    return `<div class="footer-note" style="color:var(--hard);margin-bottom:16px;">مدة جلسة الدرس الحالية (${settings.lessonMinutes} دقيقة) لا تكفي ولو لبطاقة جديدة واحدة — زيادتها قليلاً تسمح بحساب موعد الإنجاز.</div>`;
  }

  const remainingNew = getAllCards().filter(c => c.isNew).length;
  let html = `

    html += `

    } else {
      html += `<div class="footer-note" style="color:var(--gold);margin-top:10px;">💡 في البداية قد تكون بعض الأيام مزدحمة قليلاً بسبب الدفعة الأولى من البطاقات — هذا طبيعي ومؤقت، ويستقر الإيقاع من تلقاء نفسه بعد فترة قصيرة دون أي إجراء.</div>`;
    }
  }

  html += suggestionHtml();
  html += `<div class="footer-note" style="margin-top:10px;">مبني على محاكاة فعلية بافتراض تقييم "جيد" منتظم، ويُعاد حسابه تلقائياً مع أي تغيير في المدة أو الجدول أو موعد الامتحان.</div>`;
  html += `</div>`;
  return html;
}

/* ---------- بطاقة «حصة التخزين»: طريقة الحفظ وحجم بيانات هذا التطبيق وتقدير المتصفح ---------- */
let shEstText = null, shPersistText = null;
function shFmtBytes(n){ if (!(n>=0)) return "—"; if (n<1024) return Math.floor(n)+" B"; if (n<1048576) return Math.floor(n/1024)+" KB"; if (n<1073741824) return (Math.floor(n/104857.6)/10)+" MB"; return (Math.floor(n/107374182.4)/10)+" GB"; }
function shRefreshStorageInfo(){
  const put = (id, html) => { const n = document.getElementById(id); if (n) n.innerHTML = html; };
  if (navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(e => { shEstText = '<bdi dir="ltr">'+shFmtBytes(e.usage)+'</bdi> من نحو <bdi dir="ltr">'+shFmtBytes(e.quota)+'</bdi> (تقدير المتصفح)'; put("shStEst", shEstText); }, () => { shEstText = "غير متاح"; put("shStEst", shEstText); });
  } else { shEstText = "غير متاح"; put("shStEst", shEstText); }
  if (navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(p => { shPersistText = p ? "مفعّل" : "غير مفعّل (قد يُخلي المتصفح البيانات عند ضيق مساحة الجهاز)"; put("shStPersist", shPersistText); }, () => { shPersistText = "غير معروف"; put("shStPersist", shPersistText); });
  } else { shPersistText = "غير مدعوم في هذا المتصفح"; put("shStPersist", shPersistText); }
}
function storageCardHtml(){
  const idb = shStore.mode === "idb";
  let bytes = 0; shStore.keys.forEach(k => { const v = shStore.get(k); if (typeof v === "string") bytes += new Blob([v]).size; });
  setTimeout(shRefreshStorageInfo, 0);
  return `
      <div class="section-title">حصة التخزين</div>
      <div class="settings-row" id="shStorageCard" style="display:block;cursor:default;">
        <div class="settings-label">طريقة الحفظ: <b>${idb ? 'قاعدة المتصفح (<bdi dir="ltr">IndexedDB</bdi>)' : 'الذاكرة القديمة (<bdi dir="ltr">localStorage</bdi>) احتياطاً'}</b></div>
        ${!idb && shStore.reason ? `<div class="settings-desc">سبب عدم استعمال القاعدة: <bdi dir="auto">${esc(shStore.reason)}</bdi>. تُعاد المحاولة عند كل فتح.</div>` : ""}
        <div class="settings-desc" style="margin-top:8px;">حجم بيانات هذا التطبيق: <bdi dir="ltr">${shFmtBytes(bytes)}</bdi> (تقريبي، لمفاتيح هذا التطبيق وحدها)</div>
        <div class="settings-desc">المستعمل في أصل المتصفح كله (تطبيقاتك كلها): <span id="shStEst">${shEstText || "…"}</span></div>
        <div class="settings-desc">التخزين الدائم: <b id="shStPersist">${shPersistText || "…"}</b></div>
        <div class="settings-desc" style="margin-top:8px;">${idb ? 'النسخة القديمة في <bdi dir="ltr">localStorage</bdi> لم تُحذف ولا تتغيّر بعد النقل، فليست نسخة محدّثة من بياناتك.' : 'كل شيء محفوظ في <bdi dir="ltr">localStorage</bdi> كما كان قبل التحديث.'}</div>
        <div class="settings-desc">الكتابة في القاعدة غير متزامنة: قد لا تكتمل آخر كتابة إن أُغلق التطبيق قسراً في اللحظة نفسها. النسخة الاحتياطية بالتصدير هي الضمان.</div>
      </div>
`;
}

function exportContentEdits(){
  const edits = [];
  Object.keys(contentEdits).forEach(id => {
    const sd = seedOf(id), e = contentEdits[id]; if (!sd) return;
    Object.keys(EDIT_FIELDS).forEach(f => { if (typeof e[f] === "string") edits.push({ id, unit: sd.unit, unitName: UNIT_NAMES[sd.unit] || "", field: f, fieldLabel: EDIT_FIELDS[f], original: sd[f] || "", new: e[f], editedAt: e.at }); });
  });
  const payload = {
    format: "wardah-content-edits-v1", app: "شريعة باك", exportedAt: new Date().toISOString(),
    howToApply: "لكل عنصر في edits: ابحث في مصفوفة SEED_CARDS عن البطاقة ذات المعرّف id، وتحقق أن قيمة الحقل field فيها تساوي original، ثم استبدلها بـ new. الحقول: q السؤال، a الجواب، ctx موضع الاستشهاد. بعد إدخالها في الكود يمكن مسح التعديلات من التطبيق.",
    edits
  };
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "sharia-content-edits-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast("⬇️ نُزّل ملف التعديلات (" + edits.length + ")");
  } catch(e){ showToast("تعذّر تنزيل الملف"); }
}

function unitNameOf(u){ return UNIT_NAMES[u] || ("وحدة " + u); }
function isUserCard(id){ return !!notebook.userCards[id]; }
/* الملاحظة المرتبطة ببطاقة ولم تُحوَّل ولم تُؤرشف — وحدها يظهر لها 💬 أعلى البطاقة */
function linkedNoteForCard(id){ return Object.values(notebook.notes).find(n => n.linkType === "card" && n.itemId === id && !n.archived && !n.cardId) || null; }
function anyNoteForCard(id){ return Object.values(notebook.notes).find(n => n.linkType === "card" && n.itemId === id) || null; }
function notesCountForLesson(u){ return Object.values(notebook.notes).filter(n => n.unit === u && !n.archived).length; }
/* بطاقات الدفتر المستقلة في cardMap تطابق userCards دائماً، ولا تُحذف بحذف الملاحظة */
function reconcileUserCards(){
  let changed = false;
  Object.values(notebook.userCards).forEach(uc => {
    const c = cardMap[uc.id];
    if (!c){ cardMap[uc.id] = { id:uc.id, unit:uc.unit, type:"qa", q:uc.q, a:uc.a, order: 100000 + Object.keys(cardMap).length,

      <p>«🎯 المراجعة الختامية»: في آخر 30 يوماً تُضاف إلى المراجعة بطاقات قديمة لم يحن موعدها، وتقييمها لا يغيّر مواعيدها المحفوظة. يمكن إطفاؤها من الإعدادات.</p>`)}
    ${sec("🏫","الدراسة في ثانوية",`
      <p>في الإعدادات ← «🏫 الدراسة»: «🏫 أدرس في ثانوية» أو «📖 أدرس دراسة حرة». للأولى قسم «مواعيد الفروض والاختبارات»: «➕ إضافة موعد» بنوعه وتاريخه ودروسه، فيقدّر التطبيق هل تكتمل قراءة دروسه ورسوخها قبله.</p>
      <p>إن لم تكتمل في وقتها وكان تقديمها يكفي، يظهر «⏫ تقديم دروسه في جلسات الدرس» ثم «تأكيد التقديم»، ويُلغى متى شئت بـ«↩️ إلغاء التقديم».</p>`)}
    ${sec("🩹","الظروف الخاصة",`
      <p>«🌤️ الوضع الخفيف» لأسابيع الضغط: يُختار له أسبوع إلى 4 أسابيع، وينصّف جلسة الدرس وحدها ولا يمسّ المراجعة، ثم ينتهي وحده.</p>
      <p>«🧊 التجميد» لمرض أو سفر أو امتحانات: «التطبيق ككل» أو «الدرس فقط» أو «المراجعة فقط». يبقى حتى العودة بزر «استئناف الدرس» أو «استئناف المراجعة»، وعند العودة تُزاح مواعيد المراجعة بعدد أيام الغياب فلا يتراكم شيء ولا تنقطع السلسلة. وما يُقرأ في الدرس أثناء تجميد المراجعة تبدأ مراجعته في اليوم التالي للعودة.</p>
      <p>إن فات يوم دراسة دون تجميد، يظهر في الرئيسية «إزاحة المواعيد» أو «تجاهل وعرض المتراكم».</p>`)}
    ${sec("📓","الدفتر",`
      <p>تبويب «📓 الدفتر»: «✏️ ملاحظة جديدة» بعنوان ونص، وتكون الملاحظة مستقلة أو مرتبطة بدرس. البحث فوري في العناوين والنصوص، والوسوم (مهم، ملتبس، مصطلح، منهجية، وارد في البكالوريا) تصفّي الملاحظات مع عدد كل وسم، والمجلدات بزر «📁 مجلد جديد»، و«📌 تثبيت» يرفع الملاحظة إلى الأعلى، و«🗄️ أرشفة» ينقلها إلى «🗄️ الأرشيف» دون حذف.</p>
      <p>في رأس كل بطاقة زر 📝 لتدوين ملاحظة مرتبطة بها دون مغادرة الجلسة، ويظهر رمز 💬 حين تكون لها ملاحظة فيفتحها بلمسة. وفي كل درس زر «📓 ملاحظات هذا الدرس».</p>
      <p>«🎴 تحويل إلى بطاقة حفظ» يقترح السؤال من العنوان والإجابة من النص، ويُختار الدرس الذي تُضاف إليه، ثم «✅ تأكيد الإضافة». البطاقة تدخل المراجعة فعلاً، وتبقى فيها حتى لو حُذفت الملاحظة.</p>`)}

      <p>زر ✏️ في رأس كل بطاقة (و«✏️ تعديل» في قائمة الدرس) يفتح نصها للتعديل، ويظهر التعديل فوراً والبطاقة بمواعيدها. «↩️ استرجاع النص الأصلي» يعيدها كما كانت. كل التعديلات في الإعدادات ← «✏️ تعديلاتي على المحتوى»، ومنها «⬇️ تصدير التعديلات لكلود» لإدخالها في الكود لاحقاً.</p>`)}
    ${sec("💾","النسخة الاحتياطية والمظهر",`
      <p>كل التقدّم محفوظ في هذا المتصفح وحده. قبل تغيير الهاتف أو مسح المتصفح: «⬇️ تصدير تقدمي (ملف احتياطي)»، ثم «⬆️ استيراد نسخة احتياطية» في الجهاز الجديد. النسخة تحمل التقدّم والإعدادات والدفتر والتعديلات.</p>
      <p>الوضع الداكن من زر 🌙 أعلى الشاشة أو من الإعدادات.</p>`)}
    ${sec("🗄️","حصة التخزين",`
      <p>في «⚙️ الإعدادات» بطاقة «حصة التخزين» تعرض طريقة الحفظ (قاعدة المتصفح، أو الذاكرة القديمة احتياطاً مع سبب ذلك)، وحجم بيانات هذا التطبيق، وتقدير المتصفح لما استُعمل في أصله كله، وهل التخزين الدائم مفعّل.</p>
      <p>بعد النقل تبقى النسخة القديمة في <bdi dir="ltr">localStorage</bdi> كما هي ولا تُحذف ولا تتغيّر. الكتابة في القاعدة غير متزامنة، فقد لا تكتمل آخر كتابة إن أُغلق التطبيق قسراً، والضمان هو «⬇️ تصدير تقدمي (ملف احتياطي)».</p>`)}
    <button class="backup-btn" onclick="switchTab('home')">العودة للرئيسية</button>
  </div>`;
}

function toggleDarkMode(){
  settings.darkMode = !settings.darkMode;
  saveSettings(settings);
  render();
}

function setExamDate(v){
  settings.examDate = (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
  saveSettings(settings);
  showToast(settings.examDate ? "حُفظ موعد الامتحان" : "مُسح موعد الامتحان");
  render();
}
function toggleFinalReview(){
  settings.finalReview = !(settings.finalReview !== false);
  saveSettings(settings);
  render();
}
function setLightMode(weeks){
  settings.lightModeUntil = weeks > 0 ? addDays(todayStr(), weeks * 7 - 1) : null;
  saveSettings(settings);
  showToast(weeks > 0 ? "تفعّل الوضع الخفيف: الدرس بنصف المدة، المراجعة كما هي" : "عاد الإيقاع العادي");
  render();
}

function setDayType(dayIndex, type){
  if (!DAY_TYPES.includes(type)) return;
  settings.dayTypes[dayIndex] = type;
  saveSettings(settings);
  render();
}

function adjustDuration(field, delta){
  const current = settings[field] || 10;
  settings[field] = Math.max(1, Math.min(120, current + delta));
  saveSettings(settings);
  render();
}

// scope: "all" | "lesson" | "review" — نفس منطق التجميد لكل الأنواع، يختلف فقط ما يُجمَّد
function startFreeze(scope){
  const t = todayStr();
  if (scope === "all" || scope === "lesson") settings.frozenLessonSince = settings.frozenLessonSince || t;
  if (scope === "all" || scope === "review") settings.frozenReviewSince = settings.frozenReviewSince || t;
  saveSettings(settings);
  render();
}

function endFreeze(scope){
  const t = todayStr();
  if ((scope === "all" || scope === "review") && settings.frozenReviewSince){
    // أيام الغياب = ما بين يوم التجميد ويوم العودة دون الطرفين؛ مواعيد البطاقات الجديدة لا تُحتسب أصلاً
    const days = Math.max(0, daysBetween(settings.frozenReviewSince, t) - 1);
    // ما قُرئ في الدرس أثناء تجميد المراجعة: أول مراجعة له في اليوم التالي للعودة، ولا يُزاح بعدد أيام التجميد
    const firstDue = nextAllowedDay(addDays(t, 1));
    for (const id in cardMap){
      const c = cardMap[id];
      if (c.isNew) continue;
      if (c.readOn && c.readOn >= settings.frozenReviewSince) c.due = firstDue;
      else if (days > 0) c.due = addDays(c.due, days);
    }
    settings.frozenReviewSince = null;
  }
  if ((scope === "all" || scope === "lesson") && settings.frozenLessonSince){
    settings.frozenLessonSince = null;
  }
  preserveStreakAcrossGap(); // التجميد ليس انقطاعاً: السلسلة محفوظة
  saveSettings(settings);
  saveCards(cardMap);
  saveStats(stats);
  render();
}

// عند العودة بعد انقطاع (تجميد أو غياب غير مخطط)، لا نريد أن تنكسر السلسلة اليومية
// بسبب فجوة كانت مبرَّرة أو تمت معالجتها بالإزاحة.
function preserveStreakAcrossGap(){
  if (stats.lastActiveDate){
    const gap = daysBetween(stats.lastActiveDate, todayStr());
    if (gap > 1) stats.lastActiveDate = addDays(todayStr(), -1);
  }
}

function shiftForUnplannedAbsence(){
  const days = unplannedGap;
  if (days > 0){
    for (const id in cardMap){
      if (!cardMap[id].isNew) cardMap[id].due = addDays(cardMap[id].due, days); // البطاقات الجديدة لا موعد يُحتسب لها
    }
    preserveStreakAcrossGap();
    saveCards(cardMap);
    saveStats(stats);
  }
  unplannedGap = 0;
  render();
}

function dismissAbsenceBanner(){
  unplannedGap = 0;
  render();
}

function exportProgress(){
  try {
    const payload = { cards: cardMap, stats, settings, contentEdits, notebook, exportedAt: new Date().toISOString(), app: "شريعة باك" };
    const data = JSON.stringify(payload, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "shariaa-bac-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error("تعذّر تصدير النسخة الاحتياطية", e);
    alert("تعذّر إنشاء ملف التصدير. تُرجى إعادة المحاولة.");
  }
}

function importProgress(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== "object" || Array.isArray(data) || !["cards","stats","settings","contentEdits","notebook"].some(k => data[k])) throw new Error("ملف لا يحمل أيًّا من حقول النسخة الاحتياطية");
      if (data.cards){ cardMap = { ...cardMap, ...data.cards }; await saveCards(cardMap); }
      if (data.stats){ stats = { ...stats, ...data.stats }; await saveStats(stats); }
      if (data.settings){ settings = normalizeSettings({ ...settings, ...data.settings }); await saveSettings(settings); }
      if (data.contentEdits){ contentEdits = sanitizeEdits(data.contentEdits); await saveEdits(); }
      if (data.notebook){ notebook = sanitizeNotebook(data.notebook); await saveNotebook(); if (reconcileUserCards()) await saveCards(cardMap); }
      alert("تم استيراد النسخة الاحتياطية بنجاح.");
      render();
    } catch (err) {
      console.error("تعذّر قراءة ملف النسخة الاحتياطية", err);
      alert("تعذّر قراءة الملف — يلزم أن يكون نسخة احتياطية صحيحة من هذا التطبيق.");
    }
  };
  reader.readAsText(file);
}

// expose to inline handlers
window.switchTab = switchTab;
window.openUnit = openUnit;
window.toggleCardItem = toggleCardItem;
window.backToLessons = backToLessons;
window.startNewLesson = startNewLesson;
window.startDailyReview = startDailyReview;
window.answerCard = answerCard;
window.flipCard = flipCard;
window.toggleReverse = toggleReverse;
window.goPrev = goPrev;
window.goNext = goNext;
window.toggleDarkMode = toggleDarkMode;
window.setLightMode = setLightMode;
window.setDayType = setDayType;
window.adjustDuration = adjustDuration;
window.continueNewCard = continueNewCard;
window.setExamDate = setExamDate;
window.toggleFinalReview = toggleFinalReview;
window.startFreeze = startFreeze;
window.endFreeze = endFreeze;
window.shiftForUnplannedAbsence = shiftForUnplannedAbsence;
window.dismissAbsenceBanner = dismissAbsenceBanner;
window.exportProgress = exportProgress;
window.importProgress = importProgress;
</script>
