<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap');

  :root{
    /* الأزرق الأساسي: الدرجة الوسطى المعتمدة سابقاً */
    --ink:#2443AE; --ink-solid:#2443AE;
    /* الأزرق الغامق: مستخرج فعلياً من زاوية أيقونة التطبيق (#001645) */
    --ink-deep:#001645;
    --paper:#F4F6FC;
    --paper-card:#FFFFFF;
    /* الذهبي: مستخرج فعلياً من لون الهلال والنجمة في الأيقونة */
    --gold:#88652F;
    --gold-soft:#F0E4CC;
    --text:#1B2340;
    --text-muted:#5B6480;
    --hard:#C0392B;
    --med:#B05400;
    --easy:#18793F;
    --line:#DDE3F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Tajawal', sans-serif;
    color:var(--text);
    min-height:100vh;
  }
  .loading-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    color:var(--ink);font-size:18px;
  }
  .header{
    background:linear-gradient(180deg, var(--ink-solid) 0%, var(--ink-deep) 100%);
    color:#fff;padding-bottom:2px;
  }
  .header-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{font-size:22px;color:var(--gold-soft);font-family:'Amiri',serif;}
  .brand-icon{width:38px;height:38px;border-radius:10px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25);flex-shrink:0;}
  .dark-toggle-btn{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:50%;
    width:38px;height:38px;font-size:18px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-title{font-family:'Amiri',serif;font-size:22px;font-weight:700;line-height:1.1;}
  .brand-sub{font-size:12px;color:var(--gold-soft);margin-top:2px;}
  .home-btn{
    background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;padding:8px 16px;font-size:13px;font-family:'Tajawal',sans-serif;cursor:pointer;
  }
  .header-ribbon{
    display:flex;gap:8px;justify-content:center;font-size:12px;color:var(--gold-soft);
    background:rgba(0,0,0,.15);padding:6px 12px;
  }
  .dot{opacity:.5;}
  .container{max-width:480px;margin:0 auto;padding:20px 16px;}

  .hero-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:18px;
    padding:26px 20px;text-align:center;box-shadow:0 2px 10px rgba(18,59,50,.06);
  }
  .hero-label{font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .hero-number{font-family:'Amiri',serif;font-size:56px;font-weight:700;color:var(--ink);line-height:1;}
  .hero-caption{font-size:13px;color:var(--text-muted);margin:8px 0 18px;}
  .hero-card.small{padding:18px 20px;margin-bottom:8px;}
  .hero-card.small .hero-number{font-size:38px;}
  .hero-card.small .hero-caption{margin:4px 0 14px;}
  .start-btn{
    background:var(--ink-solid);color:#fff;border:none;border-radius:30px;padding:13px 32px;
    font-size:15px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;
  }
  .start-btn:disabled{opacity:.45;cursor:default;}

  .section-title{font-size:14px;font-weight:700;color:var(--ink);margin:26px 4px 10px;}
  .unit-list{display:flex;flex-direction:column;gap:10px;}
  .unit-row{background:var(--paper-card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .unit-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .unit-name{color:var(--text);font-weight:500;}
  .unit-count{color:var(--text-muted);font-size:12px;white-space:nowrap;}
  .unit-due-badge{color:var(--gold);font-weight:700;}
  .progress-track{height:6px;border-radius:4px;background:#EFE7D2;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--easy));border-radius:4px;transition:width .3s ease;}
  .footer-note{margin-top:24px;font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.7;}

  .review-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted);margin-bottom:8px;padding:0 2px;}
  .timer-badge{
    display:inline-flex;align-items:center;gap:4px;background:var(--hard);color:#fff;
    font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px;
    font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(192,57,43,.35);
  }
  .progress-track-thin{height:4px;border-radius:3px;background:#EFE7D2;overflow:hidden;margin-bottom:18px;}
  .progress-fill-thin{height:100%;background:var(--gold);transition:width .3s ease;}

  .flashcard{
    background:var(--paper-card);border:1px solid var(--line);border-radius:20px;padding:30px 22px;
    min-height:260px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 4px 16px rgba(18,59,50,.08);cursor:pointer;position:relative;
  }
  .flashcard.cloze{background:linear-gradient(180deg, var(--paper-card) 0%, #FBF3E3 100%);}
  .card-type-tag{position:absolute;top:16px;inset-inline-start:18px;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.5px;}
  body:not(.dark) .card-type-tag{color:#6f5222;}
  .card-question{font-family:'Amiri',serif;font-size:20px;line-height:1.9;color:var(--text);text-align:center;margin-top:14px;}
  .card-divider{height:1px;background:var(--line);margin:20px 0;}
  .card-answer{font-size:16px;line-height:2;color:var(--ink);text-align:center;font-weight:500;}
  .card-ctx{font-size:12px;color:var(--gold);text-align:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.7;}
  .tap-hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:22px;}

  .grade-row{display:flex;gap:8px;margin-top:16px;}
  .grade-row-placeholder{height:66px;margin-top:16px;}
  .grade-btn{
    flex:1;border:none;border-radius:14px;padding:12px 6px;color:#fff;font-family:'Tajawal',sans-serif;
    font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .grade-sub{font-size:10px;font-weight:400;opacity:.95;}
  .grade-again{background:var(--hard);}
  .grade-hard{background:#B0441C;}
  .grade-med{background:var(--med);}
  .grade-easy{background:var(--easy);}

  .nav-row{display:flex;gap:8px;margin-top:10px;}
  .unit-pick{display:flex;align-items:center;gap:8px;width:100%;text-align:right;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text);cursor:pointer;}
  .unit-pick.on{border-color:var(--ink);font-weight:700;}
  .sx-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card);}
  .sx-card.past{opacity:.6;}
  .sx-title{font-weight:800;font-size:14px;color:var(--text);margin-bottom:4px;}
  .sx-meta{font-size:12px;color:var(--text-soft, var(--text));opacity:.85;line-height:1.7;}
  .sx-line{font-size:13px;color:var(--text);line-height:1.8;margin-top:4px;}
  .sx-input{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;box-sizing:border-box;}
  textarea.sx-input{resize:vertical;line-height:1.8;}
  .edited-tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-inline-start:6px;opacity:.85;}
  .nb-chip{display:inline-block;padding:6px 12px;margin:0 0 6px 6px;border-radius:999px;border:1px solid var(--line);background:transparent;font-family:'Tajawal',sans-serif;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;}
  .nb-chip.on{border-color:var(--ink);background:var(--card);}
  .nb-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card);cursor:pointer;}
  .nb-title{font-weight:800;font-size:14px;color:var(--text);}
  .nb-snip{font-size:12.5px;color:var(--text);opacity:.8;margin-top:4px;line-height:1.7;white-space:pre-line;}
  .nb-overlay{position:fixed;inset:0;z-index:90;background:var(--paper);overflow-y:auto;}
  .nb-head{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper-card);border-bottom:1px solid var(--line);z-index:2;}
  .nb-head-title{font-weight:800;font-size:15px;color:var(--text);}
  .nb-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:16px;color:var(--text);cursor:pointer;}
  .nb-body{padding:14px 16px 40px;max-width:560px;margin:0 auto;}
  .nb-label{font-size:12.5px;font-weight:800;color:var(--text-muted);margin:12px 0 6px;}
  .nb-tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-inline-start:4px;}
  .nb-badge{display:inline-block;font-size:10.5px;color:var(--easy);font-weight:800;margin-inline-start:4px;}
  .nb-seg{display:flex;gap:0;margin:0 0 10px;}
  .nb-seg .nb-chip{flex:1;margin:0;border-radius:0;text-align:center;padding:8px 0;}
  .nb-seg .nb-chip:first-child{border-start-start-radius:12px;border-end-start-radius:12px;}
  .nb-seg .nb-chip:last-child{border-start-end-radius:12px;border-end-end-radius:12px;border-inline-start:none;}
  .nb-add{border-style:dashed;}
  .nb-wide,.nb-body .start-btn{display:block;width:100%;margin-top:14px;}
  .nb-info{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--text);background:var(--paper-card);margin-top:12px;}
  .card-icons{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px;}
  .card-ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:14px;line-height:1;cursor:pointer;padding:0;}
  .guide-sec{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);}
  .guide-sec summary{padding:12px 14px;font-weight:800;font-size:14px;color:var(--text);cursor:pointer;list-style:none;}
  .guide-sec summary::-webkit-details-marker{display:none;}

<body>
<div id="app"><div class="loading-wrap">جارٍ التحميل…</div></div>

<script>
/* ========================= شريعة باك — طبقة التخزين (IndexedDB) =========================
   تعمل قبل التطبيق: تفتح القاعدة shariaa-bac-db (المخزن kv) وتحمّل مفاتيح التطبيق الستة إلى ذاكرة وسيطة MEM.
   التطبيق يقرأ ويكتب عبر window.storage (غير متزامنة) بالشكل نفسه، فتعرّفها هذه الطبقة فوق MEM حين تنجح القاعدة،
   وإن لم تنجح ولم تُكتب العلامة بعد تركت الاحتياطي الأصلي (localStorage) فيعمل التطبيق كما كان.
   النقل نسخ لا نقل، وlocalStorage لا يُحذف منه شيء.
   العزل: لا يُلمس إلا مفاتيح هذه القائمة بالاسم الكامل، وفي قاعدة هذا التطبيق وحدها. لا مسح ولا تكرار على المفاتيح ولا حذف قواعد.
   المفاتيح القديمة العامة (islamic-srs-*) لا تُنسخ ولا تُقرأ في وضع القاعدة. */
(function(){
'use strict';
var DB_NAME = 'shariaa-bac-db', STORE = 'kv', META_KEY = '_meta';
var FLAG_KEY = 'shariaa_bac_idb_ok';            // علامة في localStorage تُكتب بعد نجاح النقل: تمنع العمل على النسخة القديمة إن تعذّر فتح القاعدة
var K_CARDS = 'bac_sharia_cards_v1', K_STATS = 'bac_sharia_stats_v1', K_SETTINGS = 'bac_sharia_settings_v1',
    K_EDITS = 'bac_sharia_edits_v1', K_NOTEBOOK = 'bac_sharia_notebook_v1', K_REVERSE = 'bac_sharia_reverse';
var DATA_KEYS = [K_CARDS, K_STATS, K_SETTINGS, K_EDITS, K_NOTEBOOK, K_REVERSE];
var OPEN_TIMEOUT = 4000, MIGRATE_TIMEOUT = 4000;

var MEM = {}, DB = null;
var S = window.shStore = { mode:'pending', reason:'', suspicious:[], migratedAt:null, keys:DATA_KEYS.slice(), dbName:DB_NAME };

/* ---------- أدوات ---------- */
function reasonOf(e){ if (!e) return 'سبب غير معروف'; var n = e.name ? String(e.name) : '', m = e.message ? String(e.message) : String(e); return (n && m.indexOf(n)<0 ? n + ': ' : '') + m; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function flagOn(){ return lsGet(FLAG_KEY) === '1'; }
function setFlag(){ try{ localStorage.setItem(FLAG_KEY, '1'); }catch(e){} }
function hasLsData(){ return DATA_KEYS.some(function(k){ return lsGet(k) !== null; }); }

/* ---------- التحقق من أن محتوى المفتاح من هذا التطبيق نفسه (بمعرّفات بطاقاته وحقوله) ---------- */
var RE_SEED = /^[ufq]\d+-\d+$/, RE_UC = /^(uc|note)-[\w\-]+$/, RE_NOTE = /^n[a-z0-9]+$/, RE_FOLDER = /^f[a-z0-9]+$/;
function isObj(x){ return !!x && typeof x === 'object' && !Array.isArray(x); }
function ownCards(d){
  if (!isObj(d)) return 'ليست خريطة بطاقات';
  var seeds = 0, bad = null;
  Object.keys(d).forEach(function(id){
    if (bad) return;
    var c = d[id];
    if (RE_SEED.test(id)) seeds++; else if (!RE_UC.test(id)) { bad = 'معرّف بطاقة غريب: ' + id.slice(0, 40); return; }
    if (!isObj(c) || (c.id !== undefined && c.id !== id)) bad = 'بطاقة لا يطابق معرّفها مفتاحها: ' + id.slice(0, 40);
  });
  if (bad) return bad;
  if (seeds < 1) return 'لا بطاقة واحدة من بطاقات هذا التطبيق';
  return true;
}
function ownStats(d){
  if (!isObj(d)) return 'ليس كائنًا';
  if (typeof d.totalReviews !== 'number' || typeof d.streak !== 'number') return 'حقول الإحصاءات (totalReviews وstreak) غير موجودة';
  return true;
}
function ownSettings(d){
  if (!isObj(d)) return 'ليس كائنًا';
  var cur = Array.isArray(d.dayTypes) && d.dayTypes.length === 7;
  var legacy = ['lessonDays', 'reviewDays', 'studyDays', 'lessonSessionsPerDay', 'sessionMinutes'].some(function(k){ return d[k] !== undefined; });
  if (typeof d.darkMode !== 'boolean' || !(cur || legacy)) return 'حقول الإعدادات (darkMode وdayTypes) غير موجودة';
  return true;
}
function ownEdits(d){
  if (!isObj(d)) return 'ليس كائن تعديلات';
  var bad = null;
  Object.keys(d).forEach(function(id){
    if (bad) return;
    var e = d[id];
    if (!RE_SEED.test(id)) { bad = 'مفتاح تعديل غريب: ' + id.slice(0, 40); return; }
    if (!isObj(e)) { bad = 'قيمة تعديل غير صالحة: ' + id.slice(0, 40); return; }
    Object.keys(e).forEach(function(f){ if (!bad && ['q', 'a', 'ctx', 'at'].indexOf(f) < 0) bad = 'حقل تعديل غريب: ' + f.slice(0, 20); else if (!bad && typeof e[f] !== 'string') bad = 'حقل تعديل ليس نصًا: ' + f; });
  });
  return bad || true;
}
function idsOf(coll, re, what){
  if (coll === undefined) return true;
  if (!coll || typeof coll !== 'object') return what + ' ليست كائنًا ولا مصفوفة';
  var isArr = Array.isArray(coll), bad = null;
  Object.keys(coll).forEach(function(k){
    if (bad) return;
    var v = coll[k];
    if (!isObj(v) || typeof v.id !== 'string' || !re.test(v.id)) { bad = 'معرّف غريب في ' + what; return; }
    if (!isArr && v.id !== k) bad = 'معرّف لا يطابق مفتاحه في ' + what;
  });
  return bad || true;
}
function ownNotebook(d){
  if (!isObj(d)) return 'ليس كائن دفتر';
  var bad = null;
  Object.keys(d).forEach(function(k){ if (!bad && ['notes', 'folders', 'userCards'].indexOf(k) < 0) bad = 'حقل دفتر غريب: ' + k.slice(0, 20); });
  if (bad) return bad;
  var a = idsOf(d.notes, RE_NOTE, 'الملاحظات'); if (a !== true) return a;
  var b = idsOf(d.folders, RE_FOLDER, 'المجلدات'); if (b !== true) return b;
  var c = idsOf(d.userCards, RE_UC, 'بطاقات الدفتر'); if (c !== true) return c;
  return true;
}
var VALIDATE = {};
VALIDATE[K_CARDS] = ownCards; VALIDATE[K_STATS] = ownStats; VALIDATE[K_SETTINGS] = ownSettings; VALIDATE[K_EDITS] = ownEdits; VALIDATE[K_NOTEBOOK] = ownNotebook;
function validateRaw(k, raw){
  if (k === K_REVERSE) return (raw === '0' || raw === '1') ? true : 'قيمة غير صالحة لتفضيل العكس';
  var d; try{ d = JSON.parse(raw); }catch(e){ return 'نص غير صالح (JSON تالف)'; }
  return VALIDATE[k](d);
}

/* ---------- IndexedDB ---------- */
function openStore(){
  return new Promise(function(res, rej){
    var req; try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ rej(e); return; }
    req.onupgradeneeded = function(){ var db = req.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error || new Error('تعذّر فتح القاعدة')); };
  });
}
function openWithTimeout(){
  return new Promise(function(res, rej){
    var done = false, t = setTimeout(function(){ if (done) return; done = true; rej(new Error('انتهت مهلة فتح القاعدة (4 ثوانٍ)')); }, OPEN_TIMEOUT);
    openStore().then(function(db){
      if (done) { try{ db.close(); }catch(e){} return; }   // فتح متأخر بعد المهلة: تُغلق القاعدة ولا تُكتب علامة
      done = true; clearTimeout(t); res(db);
    }, function(e){ if (done) return; done = true; clearTimeout(t); rej(e); });
  });
}
function readKeys(db, keys){
  return new Promise(function(res, rej){
    var out = {}, tx;
    try{
      tx = db.transaction(STORE, 'readonly'); var st = tx.objectStore(STORE);
      keys.forEach(function(k){ var r = st.get(k); r.onsuccess = function(){ if (r.result !== undefined) out[k] = r.result; }; });
    }catch(e){ rej(e); return; }
    tx.oncomplete = function(){ res(out); };
    tx.onerror = tx.onabort = function(){ rej(tx.error || new Error('فشلت القراءة من القاعدة')); };
  });
}
function putMany(db, obj){
  return new Promise(function(res, rej){
    var tx;
    try{
      tx = db.transaction(STORE, 'readwrite'); var st = tx.objectStore(STORE);
      Object.keys(obj).forEach(function(k){ st.put(obj[k], k); });
    }catch(e){ try{ if (tx) tx.abort(); }catch(x){} rej(e); return; }
    tx.oncomplete = function(){ res(); };
    tx.onerror = tx.onabort = function(){ rej(tx.error || new Error('فشلت الكتابة في القاعدة')); };
  });
}
function deleteMeta(db){ return new Promise(function(res){ try{ var tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE)['delete'](META_KEY); tx.oncomplete = tx.onerror = tx.onabort = function(){ res(); }; }catch(e){ res(); } }); }

/* ---------- النقل: نسخ مفاتيح التطبيق بالاسم، تحقق من المحتوى، كتابة، قراءة راجعة، مقارنة حرفية، ثم علامة _meta ---------- */
function migrate(db, ctx){
  var found = {}, sus = [];
  DATA_KEYS.forEach(function(k){
    var raw = lsGet(k); if (raw === null) return;
    var v = validateRaw(k, raw);
    if (v === true) found[k] = raw; else sus.push({ key:k, reason:v });
  });
  if (sus.length){ S.suspicious = sus; return Promise.reject(new Error('مفتاح لا يبدو من هذا التطبيق، فلم يُنسخ شيء: ' + sus.map(function(s){ return s.key + ' (' + s.reason + ')'; }).join('، '))); }
  var keys = Object.keys(found);
  return putMany(db, found).then(function(){ return readKeys(db, keys); }).then(function(back){
    keys.forEach(function(k){ if (back[k] !== found[k]) throw new Error('فشلت المقارنة الحرفية بعد النسخ للمفتاح ' + k); });
    if (ctx.aborted) throw new Error('انتهت مهلة النقل (4 ثوانٍ)');
    var meta = { v:1, at:new Date().toISOString(), keys:keys };
    return putMany(db, (function(){ var o = {}; o[META_KEY] = meta; return o; })()).then(function(){
      if (ctx.aborted){ return deleteMeta(db).then(function(){ throw new Error('انتهت مهلة النقل (4 ثوانٍ)'); }); } // علامة متأخرة بعد المهلة: تُسحب فلا تتباعد البيانات
      S.migratedAt = meta.at; return found;
    });
  });
}
function withTimeout(p, ms, ctx, msg){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ ctx.aborted = true; rej(new Error(msg)); }, ms);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}

function startDb(forceCopy){
  if (!window.indexedDB) return Promise.reject(new Error('IndexedDB غير متاح في هذا المتصفح'));
  var ctx = { aborted:false };
  return openWithTimeout().then(function(db){
    return readKeys(db, DATA_KEYS.concat([META_KEY])).then(function(all){
      var meta = all[META_KEY];
      if (meta){
        DATA_KEYS.forEach(function(k){ if (typeof all[k] === 'string') MEM[k] = all[k]; });
        S.migratedAt = meta.at || null; return db;
      }
      if (flagOn() && !forceCopy){ var er = new Error('بيانات هذا التطبيق لم تعد في قاعدة المتصفح، والعلامة تقول إنها نُقلت إليها'); er.evicted = true; throw er; }
      return withTimeout(migrate(db, ctx), MIGRATE_TIMEOUT, ctx, 'انتهت مهلة نقل البيانات (4 ثوانٍ)').then(function(found){
        Object.keys(found).forEach(function(k){ MEM[k] = found[k]; });
        return db;
      });
    }).then(function(d){ return d; }, function(e){ try{ db.close(); }catch(x){} throw e; });
  });
}

/* ---------- الكتابة: تحديث MEM فورًا، وتجميع الكتابات المتتالية في معاملة واحدة، ودفع فوري عند الإخفاء ---------- */
var dirty = {}, scheduled = false, flushing = false, again = false, notified = false, backoff = 1500, retryT = null;
function schedule(){ if (scheduled) return; scheduled = true; Promise.resolve().then(flush); }
/* فشل الكتابة غير المتزامنة لا يصل إلى التطبيق (دالة الحفظ فيه تنتهي قبل ذلك)، فيُبلَّغ به هنا مرة واحدة بشريط يذكر السبب الحقيقي */
function warnBar(text){
  var o = document.getElementById('shWarn');
  if (!o){
    o = document.createElement('div'); o.id = 'shWarn'; o.setAttribute('dir', 'rtl'); o.setAttribute('lang', 'ar'); o.setAttribute('role', 'alert');
    o.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147482000;padding:10px 14px;font:inherit;font-size:13px;line-height:1.7;background:var(--paper-card,#fff);color:var(--text,#1B2340);border-bottom:3px solid var(--hard,#C0392B);box-shadow:0 2px 10px rgba(0,0,0,.25)';
    (document.body || document.documentElement).appendChild(o);
  }
  o.textContent = text;
}
function clearWarnBar(){ var o = document.getElementById('shWarn'); if (o) o.remove(); }
function onWriteFail(e){
  S.lastWriteError = reasonOf(e);
  if (!notified){ notified = true; try{ warnBar('تعذّر حفظ آخر تغيير في قاعدة المتصفح، فما يُنجز الآن قد يضيع عند الإغلاق. تُعاد المحاولة تلقائيًا، ويُستحسن تصدير نسخة احتياطية الآن. السبب: ' + S.lastWriteError + '.'); }catch(x){} }
  clearTimeout(retryT); retryT = setTimeout(function(){ schedule(); }, backoff); backoff = Math.min(backoff * 2, 30000);
}
function flush(){
  scheduled = false;
