  { id:"u2-13", unit:2, type:"qa", q:"ما الوسيلة المناسبة لمواجهة (التعصب والغلو في الدين)؟", a:"مناقشة الانحرافات." },
  { id:"u2-14", unit:2, type:"qa", q:"ما الوسيلة المناسبة لمواجهة (الغفلة عن تدبر الآيات الكونية والقرآنية)؟", a:"إثارة العقل والوجدان." },
  { id:"u2-15", unit:2, type:"qa", q:"ما الوسيلة المناسبة لمواجهة (الانغماس في الملذات والشهوات)؟", a:"التذكير بمراقبة الله لخلقه، ورسم الصور المحببة للمؤمنين، ورسم صور الكافرين المنفّرة." },

  // ---------- الوحدة 3: الإسلام والرسالات السماوية ----------
  { id:"u3-01", unit:3, type:"qa", q:"ما معنى الإسلام لغةً؟", a:"الاستسلام والخضوع والانقياد." },
  { id:"u3-02", unit:3, type:"qa", q:"عرّف الإسلام اصطلاحاً بمعناه العام.", a:"الاستسلام والخضوع لله في كل أوامره ونواهيه." },
  { id:"u3-03", unit:3, type:"qa", q:"عرّف الإسلام اصطلاحاً بمعناه الخاص.", a:"الرسالة التي اكتمل بها الدين والشريعة الخاتمة إلى البشر، وبعث بها محمد ﷺ إلى العالمين." },
  { id:"u3-04", unit:3, type:"qa", q:"ما المقصود بأن (الدين واحد ورسالاته متكاملة)؟", a:"الإسلام اسم للدين المشترك الذي بعث الله به كل الأنبياء، فكل الرسالات دعت إليه ونادت به من حيث العقيدة؛ ليكون ديناً واحداً لكل أهل الأرض." },
  { id:"u3-05", unit:3, type:"qa", q:"عرّف الرسالات السماوية.", a:"ما أنزله الله على رسله وأمروا بتبليغه، ومن الرسل موسى وعيسى عليهما السلام." },
  { id:"u3-06", unit:3, type:"qa", q:"بم تتحد الرسالات السماوية في المصدر؟", a:"تتحد كلها في المصدر الرباني، فهي من عند الله، لذلك سُميت سماوية." },
  { id:"u3-07", unit:3, type:"qa", q:"اذكر غايات وحدة الرسالات السماوية (أربع).", a:"توحيد الله، تصحيح العقائد الباطلة، صيانة الكليات الخمس، الدعوة إلى مكارم الأخلاق." },
  { id:"u3-08", unit:3, type:"qa", q:"كيف مسّ التحريف الرسالات السماوية السابقة على مستوى العقيدة؟", a:"أصبحت ديانات شركية وثنية لا علاقة لها بالتوحيد." },
  { id:"u3-09", unit:3, type:"qa", q:"كيف مسّ التحريف الرسالات السماوية السابقة على مستوى الشريعة؟", a:"غيّروا وبدّلوا أحكام الله من عند أنفسهم لتتماشى مع شهواتهم وأهواء أحبارهم ورهبانهم." },

  // ---------- الوحدة 4: اليهودية المحرّفة ----------
  { id:"u4-01", unit:4, type:"qa", q:"عرّف اليهودية.", a:"الرسالة المحرّفة عن الدين الحق، التي بعث بها موسى لبني إسرائيل مؤيداً بالتوراة." },
  { id:"u4-02", unit:4, type:"qa", q:"ما المصدر الأول لليهودية، وكم عدد أسفاره؟", a:"الكتاب المقدس ويسمى التناخ، ويبلغ مجموعه 22 سفراً." },
  { id:"u4-03", unit:4, type:"qa", q:"اذكر أسفار التوراة الخمسة.", a:"التكوين، الخروج، اللاويين، العدد، التثنية." },
  { id:"u4-04", unit:4, type:"qa", q:"ما المصدر الثاني لليهودية، وما هو؟", a:"التلمود، وهو مجموع التراث الديني والفقهي الشفهي لأحبار اليهود، مقسم إلى المشنا (المتن) والجمارا (الشرح)." },
  { id:"u4-05", unit:4, type:"qa", q:"ما انحراف اليهود في اعتقادهم بالإله؟", a:"جعلوا لهم إلهاً خاصاً بهم فقط وسموه (يهوه)، وهم أبناؤه وأحباؤه." },
  { id:"u4-06", unit:4, type:"qa", q:"ماذا اعتقدت طائفة من اليهود في عزير؟", a:"أنه ابن الله." },
  { id:"u4-07", unit:4, type:"qa", q:"ماذا نسب اليهود لنبي الله سليمان؟", a:"عبادة الأصنام." },
  { id:"u4-08", unit:4, type:"qa", q:"ماذا نسب اليهود لنبي الله لوط؟", a:"شرب الخمر، وأنه زنى بابنتيه." },
  { id:"u4-09", unit:4, type:"qa", q:"ماذا نسب اليهود لنبي الله داود؟", a:"الزنا." },
  { id:"u4-10", unit:4, type:"qa", q:"ماذا نسب اليهود لنبي الله يعقوب؟", a:"الاحتيال." },
  { id:"u4-11", unit:4, type:"qa", q:"على أي أساس بنى اليهود عقيدتهم في النسب؟", a:"على أساس عرقي؛ فالاعتبار لمن وُلد من أمّ يهودية، لا باعتناق دينهم." },

  // ---------- الوحدة 5: النصرانية المحرّفة ----------
  { id:"u5-01", unit:5, type:"qa", q:"عرّف النصرانية.", a:"الرسالة التي بعث بها عيسى عليه السلام مؤيداً بالإنجيل، والنصارى هم أتباع هذه الديانة المحرّفة." },
  { id:"u5-02", unit:5, type:"qa", q:"من ماذا يتكون العهد الجديد؟", a:"مكوّن من 27 سفراً، تبدأ بالأناجيل الأربعة (متى، مرقس، لوقا، يوحنا)، إضافة إلى رسائل بولس وبطرس وغيرهم." },
  { id:"u5-03", unit:5, type:"qa", q:"ما الفرق بين موقف الكاثوليك/الأرثوذكس والبروتستانت من التقليد الكنسي؟", a:"الكاثوليك والأرثوذكس يؤمنون بسلطة الكنيسة (الباباوات والبطاركة) في التشريع وغفران الذنوب، بينما يكتفي البروتستانت بالكتاب المقدس كمصدر وحيد للوحي." },
  { id:"u5-04", unit:5, type:"qa", q:"ما انحراف التثليث عند النصارى؟", a:"الآلهة عندهم ثلاثة أقانيم: الله (الأب)، والابن (عيسى)، وروح القدس." },
  { id:"u5-05", unit:5, type:"qa", q:"ما انحراف الخطيئة والخلاص عند النصارى؟", a:"يعتقدون أن الله (الأب) بعث ابنه الوحيد (يسوع) ليخلّص البشرية من ذنب أبيهم آدم، ويتحمل العذاب (الصلب) عنهم تكفيراً عن تلك الخطيئة." },
  { id:"u5-06", unit:5, type:"qa", q:"ما انحراف التوسط والتحليل والتحريم عند النصارى؟", a:"تزعم المسيحية المحرّفة التوسط بين الله والخلق في العبادة عن طريق رجال الدين، عند الدخول في الدين ومغفرة الذنوب بعد تقديم الصلوات والقرابين." },

  // ---------- الوحدة 6: الإسلام الرسالة الخالدة ----------
  { id:"u6-01", unit:6, type:"qa", q:"ما مصادر الإسلام؟", a:"القرآن الكريم والسنة النبوية." },
  { id:"u6-02", unit:6, type:"qa", q:"عرّف القرآن الكريم اصطلاحاً.", a:"كلام الله المعجز المنزّل على خاتم الأنبياء والمرسلين محمد ﷺ بواسطة جبريل الأمين، المتعبَّد بتلاوته، المكتوب في المصاحف، المنقول إلينا بالتواتر، المبدوء بسورة الفاتحة، والمختوم بسورة الناس." },
  { id:"u6-03", unit:6, type:"qa", q:"ما معنى السنة لغةً؟", a:"الطريقة والسيرة، حميدة كانت أو ذميمة." },
  { id:"u6-04", unit:6, type:"qa", q:"عرّف السنة النبوية اصطلاحاً.", a:"ما صدر عن النبي ﷺ من قول أو فعل أو تقرير." },
  { id:"u6-05", unit:6, type:"qa", q:"اذكر خاصية من خصائص الرسالة الخالدة تتعلق بعموم الخطاب.", a:"عامة تخاطب جميع الناس، باختلاف العصور والبيئات والأزمنة." },
  { id:"u6-06", unit:6, type:"qa", q:"اذكر خاصية من خصائص الرسالة الخالدة تتعلق بالرسالات السابقة.", a:"جامعة لثمرات وقاصعة (شاملة) لمحاسن الرسالات السابقة." },
  { id:"u6-07", unit:6, type:"qa", q:"اذكر خاصية من خصائص الرسالة الخالدة تتعلق بالزمن.", a:"خالدة غير مرهونة بزمن معين، إلى أن يرث الله الأرض ومن عليها." },
  { id:"u6-08", unit:6, type:"qa", q:"اذكر خاصية من خصائص الرسالة الخالدة تتعلق بالحفظ.", a:"تكفّل الله بحفظها من التحريف والتبديل، خلافاً لما قبلها." },
  { id:"u6-09", unit:6, type:"qa", q:"كيف كانت الرسالات السابقة مبشِّرة بالرسالة الخالدة؟", a:"بشّرت الرسالات السابقة بالرسالة المحمدية الخاتمة، كما أن الرسالة الخالدة صدّقت الرسالات السابقة." },
  { id:"u6-10", unit:6, type:"qa", q:"بم كانت الرسالة الخالدة ناسخة لما قبلها؟", a:"أبطل الإسلام كثيراً من أحكام شرائع الرسالات السماوية السابقة، وسنّ لكل قوم شريعة جديدة كنسخ صوم الوصال." },
  { id:"u6-11", unit:6, type:"qa", q:"في أي جانب كانت الرسالة الخالدة مصدّقة لما قبلها؟", a:"في الأصول (التوحيد والمبادئ العامة)، والأركان العملية الكبرى (كالصلاة والصيام والزكاة مع اختلاف الشكل والمقادير)، والقيم الخلقية (كالصدق والعدل وتحريم الفواحش)." },
  { id:"u6-12", unit:6, type:"qa", q:"بم كانت الرسالة الخالدة مصحّحة لما قبلها؟", a:"جاء الإسلام مصحّحاً للانحرافات العقائدية التي أُدخلت على الرسالات السماوية السابقة." },

  // ---------- الوحدة 7: العقل في القرآن الكريم ----------
  { id:"u7-01", unit:7, type:"qa", q:"عرّف مفهوم العقل.", a:"قوة وملكة أُنيط بها التكليف." },
  { id:"u7-02", unit:7, type:"qa", q:"اذكر ثلاثاً من أهمية العقل في القرآن الكريم.", a:"العقل أحد المقاصد الضرورية الخمس، العقل منشأ الفكر ووسيلة النظر، العقل أساس التمييز بين الحق والباطل." },
  { id:"u7-03", unit:7, type:"qa", q:"اذكر دوراً من أدوار العقل في تمحيص الأفكار والموروثات.", a:"وجوب أن يكون الإيمان على بصيرة وتدبر، ووجوب غربلة ومحاكمة الموروثات والأفكار بردها إلى الشرع من حيث القبول والرد." },
  { id:"u7-04", unit:7, type:"qa", q:"في أي مجالات يُستعمل العقل؟", a:"يُستعمل في الاجتهاد فيما لا نص فيه (عن طريق القياس والمصالح المرسلة)، وفي التدبر في الكون وفي الأمور التجريبية." },
  { id:"u7-05", unit:7, type:"qa", q:"في أي مجالات لا يُستعمل العقل؟", a:"لا يُستعمل في الغيبيات والعقائد المحضة (ذات الله، الجنة، النار، حقيقة الملائكة والجن والروح)، ولا في الأمور التعبدية المحضة (عدد ركعات الصلوات الخمس، الطواف سبعاً، الصوم ثلاثين يوماً)." },

  // ---------- الوحدة 8: مقاصد الشريعة الإسلامية ----------
  { id:"u8-01", unit:8, type:"qa", q:"ما معنى المقاصد لغةً؟", a:"جمع مقصد، وهو ما تقصده وتريد الوصول إليه." },
  { id:"u8-02", unit:8, type:"qa", q:"عرّف مقاصد الشريعة الإسلامية اصطلاحاً.", a:"الغايات والأهداف التي قصدها ربنا ﷻ لتحقيق سعادة الإنسان ومصلحته في الدنيا والآخرة." },
  { id:"u8-03", unit:8, type:"qa", q:"ما المقصد العام للتشريع الإسلامي؟", a:"تحقيق مصالح الخلق جميعاً في الدارين، من خلال جملة أحكام الشريعة الإسلامية القائمة على أساس جلب المنافع ودفع المفاسد." },
  { id:"u8-04", unit:8, type:"qa", q:"عرّف المقاصد الضرورية.", a:"هي ما تقوم عليه حياة الناس، وانعدامها يؤدي إلى الفساد والهلاك في الدنيا والآخرة، وهي الكليات الخمس." },
  { id:"u8-05", unit:8, type:"qa", q:"بِمَ شُرع لحفظ الدين، وماذا حُرّم لأجله؟", a:"شُرع لحفظه الإيمان والعبادات، وحُرّم الشرك والردة." },
  { id:"u8-06", unit:8, type:"qa", q:"بِمَ شُرع لحفظ النفس، وماذا حُرّم لأجله؟", a:"شُرع لحفظها الزواج، وحُرّم الانتحار وقتل النفس إلا بالحق، وشُرع القصاص." },
  { id:"u8-07", unit:8, type:"qa", q:"بِمَ شُرع لحفظ العقل، وماذا حُرّم لأجله؟", a:"شُرع لحفظه طلب العلم والتفكر والتدبر، وحُرّم كل ما يفسده ويهلكه كالخمر والتقليد الأعمى." },
  { id:"u8-08", unit:8, type:"qa", q:"بِمَ شُرع لحفظ النسل، وماذا حُرّم لأجله؟", a:"شُرع لحفظه عقد الزواج بأركانه وشروطه، وحُرّم القذف والزنا وأوجب حدّاً لهما." },
  { id:"u8-09", unit:8, type:"qa", q:"بِمَ شُرع لحفظ المال، وماذا حُرّم لأجله؟", a:"شُرع لحفظه العمل ومختلف المعاملات التجارية كالبيع والشراء، وحُرّم الربا والسرقة والرشوة." },
  { id:"u8-10", unit:8, type:"qa", q:"عرّف المقاصد الحاجية، ومثّل لها.", a:"ما يحتاجه الناس من باب التوسعة ورفع الحرج، وعند فقدانها لا تتوقف الحياة وإنما تضيق وتتعسر. مثالها: ترخيص المريض والمسافر بالفطر في رمضان، وتشريع الطلاق." },
  { id:"u8-11", unit:8, type:"qa", q:"عرّف المقاصد التحسينية، ومثّل لها.", a:"ما زاد على الضروري والحاجي، يتم بها اكتمال وتجميل أحوال الناس وتصرفاتهم، ولا يؤدي فقدها إلى هلاك أو حرج. مثالها: الطهارة، وستر العورة، وآداب الأكل." },
  { id:"u8-12", unit:8, type:"qa", q:"رتّب أقسام المقاصد فيما بينها من حيث الأهمية.", a:"الضروريات، ثم الحاجيات، ثم التحسينيات." },
  { id:"u8-13", unit:8, type:"qa", q:"رتّب أنواع المقاصد الضرورية الخمس فيما بينها.", a:"الدين، ثم النفس، ثم العقل، ثم النسل، ثم المال." },

  // ---------- الوحدة 9: منهج الإسلام في مواجهة الانحراف والجريمة ----------
  { id:"u9-01", unit:9, type:"qa", q:"عرّف مفهوم الانحراف في الإسلام.", a:"كل سلوك يترتب عليه انتهاك للقيم والمعايير التي تحكم المجتمع." },
  { id:"u9-02", unit:9, type:"qa", q:"عرّف مفهوم الجريمة في الإسلام.", a:"محظورات شرعية زجر الله عنها بحدّ أو قصاص أو تعزير." },
  { id:"u9-03", unit:9, type:"qa", q:"اذكر وسيلة من وسائل تقوية الإيمان والوازع الديني (الجانب الوقائي).", a:"المداومة على ذكر الله، الحث على التدبر في آيات الله المسطورة والمنظورة، استشعار مراقبة الله وعظمته." },
  { id:"u9-04", unit:9, type:"qa", q:"اذكر وسيلة من وسائل الحث على العبادات ومكارم الأخلاق (الجانب الوقائي).", a:"تقوية الصلة بالله وتحقيق معنى العبودية له، الحث على استقامة سلوك الفرد، اعتبار الكف عن الجريمة قربة من القربات." },
  { id:"u9-05", unit:9, type:"qa", q:"عرّف مفهوم العقوبة في الإسلام.", a:"زواجر وضعها الله للردع عن ارتكاب ما حظر وترك ما أمر." },
  { id:"u9-06", unit:9, type:"qa", q:"عرّف الحدّ لغةً واصطلاحاً.", a:"لغة: المنع. اصطلاحاً: عقوبة مقدّرة شرعاً تجب حقاً لله." },
  { id:"u9-07", unit:9, type:"qa", q:"ما عقوبة حدّ السرقة، وما المقصد الذي يحققه؟", a:"قطع يد السارق، ويحقق مقصد حفظ المال." },
  { id:"u9-08", unit:9, type:"qa", q:"ما عقوبة حدّ شرب الخمر، وما المقصد الذي يحققه؟", a:"80 جلدة قياساً على حد القذف، ويحقق مقصد حفظ العقل." },
  { id:"u9-09", unit:9, type:"qa", q:"ما عقوبة حدّ الزنا، وما المقصد الذي يحققه؟", a:"إن كان محصناً يُرجم حتى الموت، وإن كان غير محصن فـ100 جلدة والنفي عاماً، ويحقق مقصد حفظ النسل." },
  { id:"u9-10", unit:9, type:"qa", q:"ما عقوبة حدّ القذف، ومتى تُطبّق؟", a:"80 جلدة، إذا لم يأتِ القاذف بأربعة شهداء، ويحقق مقصد حفظ النسل." },
  { id:"u9-11", unit:9, type:"qa", q:"ما عقوبة حدّ الحرابة؟", a:"القتل، أو الصلب، أو النفي، أو قطع الأيدي والأرجل من خلاف؛ ويحقق مقصد حفظ النفس والنسل والمال." },
  { id:"u9-12", unit:9, type:"qa", q:"عرّف القصاص اصطلاحاً.", a:"هو أن يُفعل بالجاني مثلما فعل بالمجني عليه." },
  { id:"u9-13", unit:9, type:"qa", q:"اذكر نوعي القصاص.", a:"في النفس: قتل القاتل المتعمد العدواني. فيما دون النفس: المماثلة." },
  { id:"u9-14", unit:9, type:"qa", q:"عرّف الدية.", a:"المال الذي يجب بسبب الجناية على أرواح الناس وأعضائهم، إذا كان عمداً ويُؤدَّى إلى المجني عليه أو وليه." },
  { id:"u9-15", unit:9, type:"qa", q:"عرّف التعزير.", a:"عقوبة غير مقدّرة شرعاً يقدّرها القاضي حسب المصلحة." },
  { id:"u9-16", unit:9, type:"qa", q:"اذكر خاصيتين من خصائص العقوبات في الإسلام.", a:"شرعية العقوبة (استناداً إلى نص)، والمساواة في العقوبة (تطبق على الجميع دون تفريق)." },
  { id:"u9-17", unit:9, type:"qa", q:"اذكر خاصيتين أخريين من خصائص العقوبات في الإسلام.", a:"العدالة في العقوبة (لا تصيب إلا من ارتكب الجريمة)، والرزانة في العقوبة (مراعاة الفروق الفردية)." },
  { id:"u9-18", unit:9, type:"qa", q:"اذكر حكمتين من الحكمة من تشريع العقوبات في الإسلام.", a:"حفظ مصالح الناس وصيانة نظام المجتمع، والتأديب والردع." },

  // ---------- الوحدة 10: المساواة أمام أحكام العقوبات ----------
  { id:"u10-01", unit:10, type:"qa", q:"من هي الصحابية راوية حديث المساواة أمام أحكام الشريعة؟", a:"عائشة بنت أبي بكر الصديق، زوج النبي ﷺ وأم المؤمنين." },
  { id:"u10-02", unit:10, type:"qa", q:"عرّف مفهوم المساواة (في سياق العقوبات).", a:"عدم التفريق بين الأغنياء والفقراء والأقوياء والضعفاء في تطبيق أحكام الحدود." },
  { id:"u10-03", unit:10, type:"qa", q:"ما الفرق بين العدل والمساواة؟", a:"العدل هو إعطاء كل ذي حق حقه، أما المساواة فهي التوزيع لشيء ما أو لحق ما بالتساوي." },
  { id:"u10-04", unit:10, type:"qa", q:"اذكر أثرين من آثار تطبيق المساواة في العقوبات الشرعية.", a:"تماسك المجتمع، وتحقق الأمن (الأخلاقي والنفسي والاقتصادي والسياسي)." },
  { id:"u10-05", unit:10, type:"qa", q:"ما حكم الشفاعة في الحدود؟", a:"التحريم؛ لإنكار النبي ﷺ على أسامة بن زيد شفاعته في المرأة المخزومية." },
  { id:"u10-06", unit:10, type:"qa", q:"ما الفرق بين الشفاعة المحمودة والمذمومة؟", a:"المحمودة تتعلق بأصحاب الحوائج المباحة كطلب منفعة أو زيادة عطاء، والمذمومة فيها تضييع لحقوق الناس وإسقاط للحدود الشرعية." },
  { id:"u10-07", unit:10, type:"qa", q:"اذكر أثرين من آثار الشفاعة في الحدود.", a:"سبب في هلاك الأمم، وتفشي الجريمة في المجتمع." },
  { id:"u10-08", unit:10, type:"qa", q:"اذكر أثرين آخرين من آثار الشفاعة في الحدود.", a:"إسقاط العدالة وهيبة القانون، وظهور الطبقية في المجتمع." },

  // ---------- الوحدة 11: الصحة النفسية والجسمية ----------
  { id:"u11-01", unit:11, type:"qa", q:"عرّف مفهوم الصحة النفسية.", a:"الحالة التي يكون فيها الإنسان مطمئناً وطبيعياً في سلوكه، ولا يعاني من اضطراب أو قلق." },
  { id:"u11-02", unit:11, type:"qa", q:"اذكر طريقتين من طرق حفظ الصحة النفسية في القرآن.", a:"الفهم الصحيح للوجود والمصير، وتقوية الصلة بالله بالذكر والعبادات." },
  { id:"u11-03", unit:11, type:"qa", q:"عرّف مفهوم الصحة الجسمية.", a:"الحالة التي يكون فيها الإنسان صحيح البدن خالياً من العاهات والأمراض العضوية." },
  { id:"u11-04", unit:11, type:"qa", q:"اذكر الأنواع الثلاثة لطرق حفظ الصحة الجسمية في القرآن.", a:"الوقاية، العلاج، التأهيل." },
  { id:"u11-05", unit:11, type:"qa", q:"اذكر عنصرين تتحقق بهما الوقاية الصحية في القرآن.", a:"تحريم الميتة ولحم الخنزير وما أُهل لغير الله، وتشريع الطهارة." },
  { id:"u11-06", unit:11, type:"qa", q:"اذكر عنصرين آخرين تتحقق بهما الوقاية الصحية في القرآن.", a:"الاعتدال في المأكل والمشرب، وممارسة الرياضة الصحية النافعة." },
  { id:"u11-07", unit:11, type:"qa", q:"ما حكم الإعفاء من بعض الفرائض في المرض والسفر؟", a:"رخصة؛ إذ أسقط الشرع بعض الفروض أو خفّف فيها في ظروف خاصة، كإباحة الإفطار في رمضان للمسافر والمريض." },

  // ---------- الوحدة 12: الإجماع ----------
  { id:"u12-01", unit:12, type:"qa", q:"ما معنى الإجماع لغةً؟", a:"العزم أو الاتفاق." },
  { id:"u12-02", unit:12, type:"qa", q:"عرّف الإجماع اصطلاحاً.", a:"اتفاق جميع المجتهدين من المسلمين في عصر من العصور، بعد وفاة الرسول ﷺ، على حكم من الأحكام الشرعية العملية." },
  { id:"u12-03", unit:12, type:"qa", q:"ما حجية الإجماع؟", a:"حجة يجب العمل به ويحرم مخالفته." },
  { id:"u12-04", unit:12, type:"qa", q:"عرّف الإجماع الصريح.", a:"أن يتفق المجتهدون على قول أو فعل بشكل صريح دون أن يخالف في ذلك واحد منهم." },
  { id:"u12-05", unit:12, type:"qa", q:"عرّف الإجماع السكوتي.", a:"أن يقول أو يعمل أحد المجتهدين بقول أو بعمل، فيعلم الباقون بذلك فلا يظهرون معارضة له." },
  { id:"u12-06", unit:12, type:"qa", q:"اذكر مثالاً عن الإجماع الصريح.", a:"إجماع الصحابة على استخلاف أبي بكر الصديق، وإجماع الصحابة على جمع القرآن الكريم في مصحف واحد." },

  // ---------- الوحدة 13: القياس ----------
  { id:"u13-01", unit:13, type:"qa", q:"ما معنى القياس لغةً؟", a:"التقدير والمساواة." },
  { id:"u13-02", unit:13, type:"qa", q:"عرّف القياس اصطلاحاً.", a:"إلحاق مسألة لم يرد فيها نص بمسألة ورد فيها نص في الحكم؛ لاشتراكهما في نفس العلة." },
  { id:"u13-03", unit:13, type:"qa", q:"لماذا يُعد القياس حجة؟", a:"لأنه يفيد غلبة الظن، ويستند إلى علة حقيقية ظاهرة يتفق العمل بها مع مقاصد الشريعة." },
  { id:"u13-04", unit:13, type:"qa", q:"اذكر أركان القياس الأربعة.", a:"الأصل، الفرع، حكم الأصل، العلة." },
  { id:"u13-05", unit:13, type:"qa", q:"عرّف الأصل في أركان القياس.", a:"يُسمى المقيس عليه، وهو الأمر الذي ورد النص بحكمه." },
  { id:"u13-06", unit:13, type:"qa", q:"عرّف الفرع في أركان القياس، وما شرطه؟", a:"يُسمى المقيس، ويُشترط فيه قيام علة حكم الأصل فيه، وأن تكون العلة في الفرع مساوية لها في الأصل." },
  { id:"u13-07", unit:13, type:"qa", q:"عرّف العلة في أركان القياس.", a:"الوصف المشترك بين الأصل والفرع، والذي من أجله شُرع الحكم في الأصل." },
  { id:"u13-08", unit:13, type:"qa", q:"اذكر مثالاً عن القياس.", a:"قياس المخدرات على الخمر، وقياس تحريم ضرب الوالدين أو سبّهما على تحريم قول (أفٍّ) لهما." },

  // ---------- الوحدة 14: المصالح المرسلة ----------
  { id:"u14-01", unit:14, type:"qa", q:"ما معنى المصلحة لغةً، وما معنى المرسلة؟", a:"المصلحة تعني المنفعة، أما المرسلة فتعني المطلقة." },
  { id:"u14-02", unit:14, type:"qa", q:"عرّف المصلحة المرسلة اصطلاحاً.", a:"استنباط الحكم في مسألة لا نص فيها ولا إجماع، بناء على مصلحة لا دليل من الشارع على اعتبارها ولا على إلغائها." },
  { id:"u14-03", unit:14, type:"qa", q:"اذكر ثلاثة من شروط العمل بالمصلحة المرسلة.", a:"أن تكون ملائمة لمقاصد الشرع الضرورية لقيام مصالح العباد، وأن تكون عامة لا خاصة، وأن تكون معقولة في ذاتها حقيقة لا وهماً." },
  { id:"u14-04", unit:14, type:"qa", q:"اذكر شرطين آخرين من شروط العمل بالمصلحة المرسلة.", a:"ألا تنافي أصلاً من أصول الشريعة، وعدم تفويتها لمصلحة أهم منها." },
  { id:"u14-05", unit:14, type:"qa", q:"اذكر مثالاً عن المصلحة المرسلة.", a:"وضع قواعد خاصة بالمرور، والإلزام بتوثيق عقد الزواج بوثيقة رسمية." },

  // ---------- الوحدة 15: القيم في القرآن الكريم ----------
  { id:"u15-01", unit:15, type:"qa", q:"عرّف مفهوم القيم.", a:"مجموعة المبادئ والأخلاق والمثل العليا التي نزل بها الوحي لتحديد علاقة الإنسان بنفسه ومجتمعه وخالقه." },
  { id:"u15-02", unit:15, type:"qa", q:"عرّف قيمة الصدق مع ذكر أحد آثاره.", a:"قول الحق ومطابقة الكلام للواقع؛ فالمسلم صادق مع ربه ونفسه والناس. من آثاره: تماسك الأسرة واستمرارها." },
  { id:"u15-03", unit:15, type:"qa", q:"عرّف قيمة الحياء.", a:"الاحتشام والوقار، خُلق من الأخلاق العظيمة المعدودة من شعب الإيمان، يبعث على فعل الحسن وترك القبيح." },
  { id:"u15-04", unit:15, type:"qa", q:"عرّف قيمة الأمانة مع ذكر أحد آثارها.", a:"كل ما يلزم على الإنسان أداؤه وحفظه، ويشمل جميع ما نصّ عليه الدين الإسلامي من أوامر وتشريعات. من آثارها: نفي صفة النفاق عن المسلم." },
  { id:"u15-05", unit:15, type:"qa", q:"عرّف قيمة المودة والرحمة (الأسرية) مع أثرها.", a:"دفء العلاقة الزوجية التي تنمي الود والتراحم الذي ينشر في البيت الاحترام والسكون والانسجام؛ من آثارها تماسك الأسرة واستمرارها." },
  { id:"u15-06", unit:15, type:"qa", q:"عرّف قيمة المعاشرة بالمعروف (الأسرية).", a:"حسن التعامل المتبادل بين الزوجين، المفضي إلى المحبة والتعاون." },
  { id:"u15-07", unit:15, type:"qa", q:"عرّف قيمة التكافل الاجتماعي مع أثرها.", a:"التضامن بين أفراد المجتمع لتحقيق المنافع والوقوف مع المعوزين والمحتاجين ولنشر كل ما فيه مصلحة للوطن والأفراد؛ من آثاره انتشار الخير والتغلب على الأزمات." },
  { id:"u15-08", unit:15, type:"qa", q:"عرّف قيمة التعاون (الاجتماعية).", a:"التفاعل المشترك بين أفراد المجتمع في مجالات الحياة لنشر الخير وتحقيقه." },
  { id:"u15-09", unit:15, type:"qa", q:"عرّف قيمة العدل (السياسية) مع أحد آثارها.", a:"وضع الأمور في نصابها وإعطاء الحقوق لأصحابها مهما كان جنسهم أو دينهم؛ من آثاره تحقيق الأمن والاستقرار والتنمية." },
  { id:"u15-10", unit:15, type:"qa", q:"عرّف قيمة الشورى (السياسية).", a:"تبادل وجهات النظر بين الحاكم وأهل الحل والعقد من رعيته للوصول لأصوب الآراء وأصلحها." },
  { id:"u15-11", unit:15, type:"qa", q:"عرّف قيمة الطاعة (السياسية).", a:"الامتثال للحاكم بالتزام أوامره واحترامه، في غير معصية الله." },

  // ---------- الوحدة 16: الوقف في الإسلام ----------
  { id:"u16-01", unit:16, type:"qa", q:"ما معنى الوقف لغةً؟", a:"الحبس والمنع." },
  { id:"u16-02", unit:16, type:"qa", q:"عرّف الوقف اصطلاحاً.", a:"حبس الأصل وتسبيل المنفعة." },
  { id:"u16-03", unit:16, type:"qa", q:"ما حكم الوقف؟", a:"من الأعمال المستحبة، دلّ على مشروعيته حديث (إذا مات ابن آدم انقطع عمله...) وعموم الأدلة التي تحث على فعل الخيرات." },
  { id:"u16-04", unit:16, type:"qa", q:"اذكر مثالاً عن الوقف في الماضي.", a:"وقف عثمان بن عفان لبئر رومة، ووقف عمر بن الخطاب لأرض له بخيبر." },
  { id:"u16-05", unit:16, type:"qa", q:"اذكر مثالاً عن الوقف في الحاضر.", a:"وقف الأراضي لبناء المساجد أو المدارس أو شق الطرقات، وحفر الآبار وغرس الأشجار للمنفعة العامة." },
  { id:"u16-06", unit:16, type:"qa", q:"اذكر أثرين نفسيين للوقف.", a:"تحرير النفس من البخل والشح، ويزيد من إيمان العبد." },
  { id:"u16-07", unit:16, type:"qa", q:"اذكر أثرين اجتماعيين للوقف.", a:"تحقيق التكافل المالي، ويُغني الفقراء عن الحرام." },
  { id:"u16-08", unit:16, type:"qa", q:"اذكر أثرين اقتصاديين للوقف.", a:"المساهمة في استثمار الأموال وتنميتها، والمردود الاقتصادي للوقف." },
  { id:"u16-09", unit:16, type:"qa", q:"اذكر أثرين أخرويين للوقف.", a:"استمرار الثواب بعد الموت، ونيل رضا الله والفوز بالجنة." },

  // ---------- الوحدة 17: مدخل إلى علم الميراث ----------
  { id:"u17-01", unit:17, type:"qa", q:"ما معنى الميراث لغةً؟", a:"انتقال الشيء من قوم إلى قوم آخرين." },
  { id:"u17-02", unit:17, type:"qa", q:"عرّف الميراث اصطلاحاً.", a:"اسم لما يستحقه الوارث من مورثه بسبب من أسباب الإرث، سواء كان المتروك مالاً أو عقاراً أو من الحقوق الشرعية، ويسمى إرث الفرائض." },
  { id:"u17-03", unit:17, type:"qa", q:"عرّف علم الميراث.", a:"العلم الذي يُعرف به من يرث ومن لا يرث، ومقدار إرث كل وارث، ويسمى علم الفرائض." },
  { id:"u17-04", unit:17, type:"qa", q:"اذكر حكمتين من حكمة تشريع الميراث.", a:"عدم احتكار المال في يد واحدة، ووسيلة لتحقيق التكافل الأسري." },
  { id:"u17-05", unit:17, type:"qa", q:"رتّب الحقوق المتعلقة بالتركة.", a:"تجهيز الميت، قضاء ديون الميت، تنفيذ وصيته في حدود الثلث إذا كانت لغير وارث، حق الورثة." },
  { id:"u17-06", unit:17, type:"qa", q:"اذكر أركان الميراث الثلاثة.", a:"الوارث، المورِّث، الموروث." },
  { id:"u17-07", unit:17, type:"qa", q:"عرّف الوارث والمورِّث والموروث.", a:"الوارث: الشخص الحي الذي ينتقل إليه الميراث. المورِّث: الشخص المتوفى. الموروث: المال أو الحق المنتقل من المتوفى إلى الحي." },
  { id:"u17-08", unit:17, type:"qa", q:"اذكر شروط الميراث الأربعة.", a:"موت المورِّث حقيقة أو حكماً، حياة الوارث بعد موت المورِّث ولو بلحظة، انعدام مانع من موانع الإرث، العلم بدرجة القرابة." },
  { id:"u17-09", unit:17, type:"qa", q:"اذكر أسباب الإرث الثلاثة.", a:"النسب الحقيقي، الزواج الصحيح، الولاء." },
  { id:"u17-10", unit:17, type:"qa", q:"عرّف الولاء كسبب من أسباب الإرث.", a:"أن يُعتق الإنسان عبداً، فإذا مات العبد المُعتَق ولا وارث له، كان ميراثه لمولاه الذي أعتقه." },
  { id:"u17-11", unit:17, type:"qa", q:"اذكر موانع الإرث السبعة (كما اختُصرت في عبارة: عف لك رزق).", a:"عدم الاستهلال، الشك في أسبقية الوفاة، اللعان، الكفر، الرق، الزنى، القتل العمد." },

  // ---------- الوحدة 18: الورثة وطرق ميراثهم ----------
  { id:"u18-01", unit:18, type:"qa", q:"عرّف الفرض لغةً واصطلاحاً.", a:"لغة: التقدير والتأثير. اصطلاحاً: النصيب الذي قدّره الشارع للوارث." },
  { id:"u18-02", unit:18, type:"qa", q:"اذكر الأنصبة المقدَّرة للفرض.", a:"1/2، 1/4، 1/8، 2/3، 1/3، 1/6." },
  { id:"u18-03", unit:18, type:"qa", q:"عرّف العصبة اصطلاحاً.", a:"من يأخذ المال كله عند انفراده، والباقي بعد أصحاب الفروض." },
  { id:"u18-04", unit:18, type:"qa", q:"من الوارثان اللذان يرثان بالفرض والتعصيب معاً؟", a:"الأب والجد." },
  { id:"u18-05", unit:18, type:"qa", q:"كيف يرث الأب بالفرض والتعصيب معاً؟", a:"يأخذ 1/6 عند وجود الفرع الوارث المذكر، + 1/6 الباقي بالتعصيب عند وجود الفرع الوارث المؤنث، والتعصيب فقط عند انعدام الفرع الوارث مطلقاً." },
  { id:"u18-06", unit:18, type:"qa", q:"اذكر أربعة من الوارثين من الرجال.", a:"الابن، ابن الابن وإن نزل، الأب، الجد من قبل الأب." },
  { id:"u18-07", unit:18, type:"qa", q:"اذكر أربعة من الوارثات من النساء.", a:"البنت، بنت الابن، الأم، الزوجة." },
  { id:"u18-08", unit:18, type:"qa", q:"اذكر معايير التفاوت في الأنصبة الثلاثة.", a:"درجة القرابة، الوارث المقبل على الحياة، العبء المالي." },
  { id:"u18-09", unit:18, type:"qa", q:"اشرح معيار درجة القرابة.", a:"كلما اقتربت الصلة زاد النصيب في الميراث، وكلما ابتعدت قلّ النصيب، دون اعتبار جنس الوارثين." },
  { id:"u18-10", unit:18, type:"qa", q:"اشرح معيار الوارث المقبل على الحياة.", a:"الأجيال التي تستقبل الحياة وتستعد لتحمل أعبائها عادة يكون نصيبها أكبر من نصيب الأجيال التي تستدبر الحياة، بصرف النظر عن الذكورة والأنوثة." },
  { id:"u18-11", unit:18, type:"qa", q:"اشرح معيار العبء المالي.", a:"العبء الذي يوجب الشرع الإسلامي على الوارث تحمله والقيام به تجاه الآخرين، وهو المعيار الوحيد الذي يُثمر تفاوتاً بين الذكر والأنثى." },

  // ---------- الوحدة 19: الربا وأحكامه ----------
  { id:"u19-01", unit:19, type:"qa", q:"ما معنى الربا لغةً؟", a:"الزيادة والنمو." },
  { id:"u19-02", unit:19, type:"qa", q:"عرّف الربا اصطلاحاً.", a:"عقد على عوض مخصوص غير معلوم التماثل في معيار الشرع حالة العقد، أو مع التأخير في البدلين أو أحدهما." },
  { id:"u19-03", unit:19, type:"qa", q:"ما حكم الربا، وعلى أي دليل؟", a:"لا خلاف بين الفقهاء على تحريمه، بدليل الكتاب والسنة والإجماع." },
  { id:"u19-04", unit:19, type:"qa", q:"اذكر الجانب النفسي من حكمة تحريم الربا.", a:"يورث في نفوس الأغنياء الجشع والطمع والأنانية، ويولد في نفوس الفقراء العداوة والبغضاء اتجاه الأغنياء." },
  { id:"u19-05", unit:19, type:"qa", q:"اذكر الجانب الاجتماعي من حكمة تحريم الربا.", a:"يؤدي إلى إيجاد طبقة مترفة لا تعمل وتكسب المال، وبالمقابل طبقة فقيرة، ويولّد العداوة والبغضاء بين أفراد المجتمع." },
  { id:"u19-06", unit:19, type:"qa", q:"اذكر الجانب الاقتصادي من حكمة تحريم الربا.", a:"من أسباب تضخم الثروة وارتفاع الأسعار، وللمحافظة على مال المسلم حتى لا يؤكل بالباطل، وسبب من أسباب الإفلاس وظهور المديونية." },
  { id:"u19-07", unit:19, type:"qa", q:"عرّف ربا الديون ومثّل له.", a:"القرض ذو الأجل، والزيادة المشروطة التي يأخذها الدائن من المدين نظير التأجيل؛ وهذا الربا كان منتشراً في الجاهلية." },
  { id:"u19-08", unit:19, type:"qa", q:"عرّف ربا الفضل ومثّل له.", a:"بيع مطعومين أو نقدين من جنس واحد مع زيادة أحد البدلين عن الآخر، مثل بيع قنطار قمح صلب بقنطارين قمح لين." },
  { id:"u19-09", unit:19, type:"qa", q:"عرّف ربا النسيئة ومثّل له.", a:"التأجيل في تسليم أحد البدلين الربويين، سواء اتحد جنسهما أم اختلف، بزيادة أو بغير زيادة." },
  { id:"u19-10", unit:19, type:"qa", q:"ما علة تحريم الربا في الذهب والفضة؟", a:"الثمنية." },
  { id:"u19-11", unit:19, type:"qa", q:"ما علة تحريم الربا في بقية الأصناف كالقمح والشعير والتمر والملح؟", a:"الاقتيات والادخار (الطعمية)." },
  { id:"u19-12", unit:19, type:"qa", q:"اذكر القاعدة الأولى لاستبعاد المعاملات الربوية.", a:"إذا كان التبادل من نفس الجنس واتفقا في العلة، يُشترط المساواة (مثلاً بمثل) والفورية (يداً بيد)." },
  { id:"u19-13", unit:19, type:"qa", q:"اذكر القاعدة الثانية لاستبعاد المعاملات الربوية.", a:"إذا كان البديلان من جنسين مختلفين واتفقا في العلة، يُشترط الفورية فقط." },
  { id:"u19-14", unit:19, type:"qa", q:"اذكر القاعدة الثالثة لاستبعاد المعاملات الربوية.", a:"في حالة تبادل جنسين مختلفين في الجنس والعلة معاً، يسقط الشرطان." },

  // ---------- الوحدة 20: من المعاملات المالية الجائزة ----------
  { id:"u20-01", unit:20, type:"qa", q:"عرّف بيع الصرف اصطلاحاً.", a:"بيع النقد جنساً بجنس أو بغير جنس." },
  { id:"u20-02", unit:20, type:"qa", q:"ما حكم بيع الصرف وشروطه؟", a:"جائز بشرط التقابض الفوري إذا اتحد الجنسان، أما إذا اختلف الجنسان فتجوز المفاضلة ولا يُشترط إلا التسليم الفوري." },
  { id:"u20-03", unit:20, type:"qa", q:"عرّف بيع التقسيط اصطلاحاً.", a:"عقد على مبيع حالٍّ، بثمن مؤجَّل، يُؤدَّى مفرَّقاً على أجزاء معلومة، في أوقات معلومة." },
  { id:"u20-04", unit:20, type:"qa", q:"اذكر شرطين من شروط بيع التقسيط.", a:"ألا يكون بيع التقسيط ذريعة إلى الربا، وأن يكون البائع مالكاً للسلعة." },
  { id:"u20-05", unit:20, type:"qa", q:"عرّف بيع المرابحة اصطلاحاً.", a:"بيع ما اشترى بثمنه مع ربح معلوم." },
  { id:"u20-06", unit:20, type:"qa", q:"اذكر شرطين من أهم شروط بيع المرابحة.", a:"أن يكون الثمن الأول معلوماً للطرفين، وأن يكون الربح محدداً أو نسبة معلومة من الثمن الأول." },
  { id:"u20-07", unit:20, type:"qa", q:"من شروط المرابحة أيضاً — ماذا يجب على البائع قبل البيع؟", a:"يجب على البائع أن يتملك السلعة (العين) قبل بيعها للمشتري." },

  // ---------- الوحدة 21: الحرية الشخصية وعلاقتها بحقوق الآخرين ----------
  { id:"u21-01", unit:21, type:"qa", q:"عرّف مفهوم الحرية الشخصية.", a:"قدرة الفرد على اتخاذ قراراته وتحديد خياراته بنفسه، دون التعرض للإجبار أو الضغط من أي جهة خارجية." },
  { id:"u21-02", unit:21, type:"qa", q:"اذكر ضابطين من ضوابط الحرية الشخصية.", a:"عدم المساس بنصوص الدين وأحكامه، وعدم المساس بالأخلاق والأعراف المعتبرة شرعاً." },
  { id:"u21-03", unit:21, type:"qa", q:"اذكر ضابطين آخرين من ضوابط الحرية الشخصية.", a:"عدم المساس بالقوانين والنظام العام، وعدم المساس بحقوق وحريات الآخرين." },
  { id:"u21-04", unit:21, type:"qa", q:"عرّف مسؤولية تغيير المنكر.", a:"فاعلية كل أفراد الأمة، ودورهم الإيجابي في إصلاح المجتمع خدمة لدينهم ووطنهم، بشرط ألا تؤدي إلى تفويت حقوق أعظم منها." },
  { id:"u21-05", unit:21, type:"qa", q:"اذكر مراتب تغيير المنكر الثلاث.", a:"الإنكار باليد (لمن يملك السلطة)، فإن لم يقدر أنكر بلسانه، فإن لم يستطع أنكر بقلبه." },
  { id:"u21-06", unit:21, type:"qa", q:"اذكر شرطاً من شروط الأمر بالمعروف والنهي عن المنكر.", a:"أن يكون متفقاً عليه أنه منكر غير مختلف فيه، وأن يكون ظاهراً وليس عن طريق التجسس والبحث." },

  // ---------- الوحدة 22: النسب، التبني، الكفالة ----------
  { id:"u22-01", unit:22, type:"qa", q:"عرّف النسب لغةً واصطلاحاً.", a:"لغة: القرابة والالتحاق. اصطلاحاً: إلحاق الولد ذكراً كان أو أنثى بوالده." },
  { id:"u22-02", unit:22, type:"qa", q:"اذكر أهمية من أهمية النسب.", a:"له علاقة بمقاصد الشريعة الضرورية {حفظ النسل والعرض}، وهو أحد أسباب الإرث." },
  { id:"u22-03", unit:22, type:"qa", q:"ما سبب النسب؟", a:"الزواج، وهو العلاقة الزوجية القائمة على عقد صحيح أو فاسد." },
  { id:"u22-04", unit:22, type:"qa", q:"اذكر طرق إثبات النسب.", a:"الإقرار، والبينة الشرعية {وثيقة عقد الزواج، الشهود، البصمة الوراثية عند النزاع}." },
  { id:"u22-05", unit:22, type:"qa", q:"عرّف الإقرار كطريقة لإثبات النسب.", a:"الاعتراف بالبنوة المباشرة، بحيث يصرح الرجل: هذا الولد مني." },
  { id:"u22-06", unit:22, type:"qa", q:"ما البصمة الوراثية (ADN) وأين تُستعمل في إثبات النسب؟", a:"وسيلة علمية تدل على هوية كل إنسان بعينه، ويُعتمد عليها من باب المصلحة المرسلة في حالات التنازع على مجهول النسب." },
  { id:"u22-07", unit:22, type:"qa", q:"اذكر حقاً من حقوق الطفل مجهول النسب.", a:"أن يكون له اسم وهوية، واعتباره أخاً في الدين، وإدماجه في المجتمع." },
  { id:"u22-08", unit:22, type:"qa", q:"عرّف التبني اصطلاحاً.", a:"أن يتخذ الإنسان ولد غيره ابناً له فيجعله كالابن المولود له من النسب الصحيح." },
  { id:"u22-09", unit:22, type:"qa", q:"ما حكم التبني؟", a:"حرام مهما كانت دوافعه؛ بدليل قوله تعالى: ﴿ادعوهم لآبائهم هو أقسط عند الله﴾." },
  { id:"u22-10", unit:22, type:"qa", q:"اذكر حكمة من حكمة تحريم التبني.", a:"يؤدي إلى اختلاط الأنساب والعائلات، ونظام الإرث قائم على القرابة النسبية وليس بالادعاء الكاذب." },
  { id:"u22-11", unit:22, type:"qa", q:"عرّف الكفالة اصطلاحاً، وما حكمها؟", a:"الالتزام بالقيام على شؤون المكفول وتربيته ورعايته، وحكمها المشروعية." },
  { id:"u22-12", unit:22, type:"qa", q:"اذكر حكمة من حكمة تشريع الكفالة.", a:"رعاية الأطفال والحفاظ عليهم من الجانب الحسي (النفقة) والمعنوي (الحضانة)، وهي بديل عن التبني المحرَّم." },

  // ---------- الوحدة 23: العلاقات الاجتماعية بين المسلمين وغيرهم ----------
  { id:"u23-01", unit:23, type:"qa", q:"ما نظرة الإسلام إلى اختلاف الدين؟", a:"اختلاف الدين واقع بمشيئة الله، وهو الذي منح الناس الاختيار فيما يفعلون ويتركون." },
  { id:"u23-02", unit:23, type:"qa", q:"المسلم مكلّف بماذا تجاه غير المسلمين؟", a:"بدعوة الناس لا بمحاسبتهم على إيمانهم أو كفرهم؛ فمهمته التبليغ والبيان، والحساب لله وحده." },
  { id:"u23-03", unit:23, type:"qa", q:"اذكر أساساً من أسس علاقة المسلمين بغيرهم.", a:"التعارف والتواصل، التعايش السلمي، التعاون." },
  { id:"u23-04", unit:23, type:"qa", q:"اذكر واجباً من واجبات غير المسلمين في بلد المسلمين.", a:"مراعاة شعور المسلمين، وترك قتال المسلمين والتآمر عليهم، واحترام القانون." },
  { id:"u23-05", unit:23, type:"qa", q:"اذكر حقاً من حقوق غير المسلمين في بلد الإسلام.", a:"حق الحماية، وعدم الإكراه في الدين، وحق العمل والتأمين." },

  // ---------- الوحدة 24: خطبة الرسول ﷺ في حجة الوداع ----------
  { id:"u24-01", unit:24, type:"qa", q:"متى وأين أُلقيت خطبة حجة الوداع؟", a:"في التاسع من ذي الحجة، في السنة العاشرة للهجرة، يوم عرفة فوق جبل الرحمة." },
  { id:"u24-02", unit:24, type:"qa", q:"اذكر القيمة التشريعية لخطبة حجة الوداع.", a:"بيان الأصول العامة للتشريع الإسلامي، وإعلان كمال الدين وتمام النعمة بالإسلام." },
  { id:"u24-03", unit:24, type:"qa", q:"اذكر القيمة الحضارية لخطبة حجة الوداع.", a:"تُعتبر من أعظم التراث التشريعي الحضاري، لاشتمالها على الدعوة إلى ضمان حقوق الإنسان في الحياة، ووضع الأسس التنظيمية لعلاقة الأفراد ببعضهم." },
  { id:"u24-04", unit:24, type:"qa", q:"اشرح حق الحياة كما ورد في خطبة حجة الوداع.", a:"حق مقدس لا يحل لأحد المساس به، سواء من الغير أو من صاحبها نفسه كالانتحار لأي ظرف كان." },
  { id:"u24-05", unit:24, type:"qa", q:"اشرح حق التملك كما ورد في خطبة حجة الوداع.", a:"يحترم الإسلام حق الإنسان في الملكية ما لم تكن قائمة على استغلال الناس." },
  { id:"u24-06", unit:24, type:"qa", q:"اشرح الحق في الأمن كما ورد في خطبة حجة الوداع.", a:"كفل الإسلام للإنسان الأمن، فلا يحل لأحد اعتقاله أو تعذيبه أو أخذ ماله وعرضه بدون وجه حق." },
  { id:"u24-07", unit:24, type:"qa", q:"اذكر الحقوق الأسرية (المالية) الواردة في خطبة حجة الوداع.", a:"للزوجة على زوجها حقوق مالية: المهر، النفقة، السكنى." },
  { id:"u24-08", unit:24, type:"qa", q:"اذكر الحقوق الأسرية (غير المالية) الواردة في خطبة حجة الوداع.", a:"العدل في القسم بين الزوجات، والمعاشرة بالمعروف، وعدم الإضرار بالزوجة." },
  { id:"u24-09", unit:24, type:"qa", q:"اشرح الحق في المساواة والعدالة كما ورد في خطبة حجة الوداع.", a:"من حقوق الإنسان المساواة والعدل وعدم التمييز بين الأفراد على أساس الجنس أو اللون أو اللغة أو العرق أو المستوى الاجتماعي أو القرابة." },

  // ---------- ملحق: جداول الفروق (31 جدولاً) ----------
  { id:"f01-1", unit:99, type:"qa", q:"قارن بين العقيدة الإسلامية ومقاصد الشريعة الإسلامية من حيث المفهوم.", a:"العقيدة: التصديق الجازم بوجود الله وما يجب له من التوحيد في ربوبيته وألوهيته وأسمائه وصفاته، والإيمان بالأصول الستة والغيبيات. المقاصد: الغايات والأهداف التي قصدها ربنا لتحقيق سعادة الإنسان ومصلحته في الدنيا والآخرة." },
  { id:"f01-2", unit:99, type:"qa", q:"قارن بين العقيدة الإسلامية ومقاصد الشريعة من حيث المصدر والمجال.", a:"العقيدة: مصدرها القرآن والسنة، ومجالها توحيد الله والإيمان بالأصول الستة والغيبيات. المقاصد: مصدرها القرآن والسنة والاجتهاد، ومجالها جوانب الحياة التي تسعى الشريعة لتنظيمها لتحقيق الخير ودفع الضرر." },

  { id:"f02-1", unit:99, type:"qa", q:"قارن بين الإسلام بمعناه العام والإسلام بمعناه الخاص من حيث المفهوم.", a:"بمعناه العام: الاستسلام والخضوع لله في كل أوامره ونواهيه. بمعناه الخاص: الرسالة التي اكتمل بها الدين والشريعة الخاتمة إلى البشر، بعث بها محمد ﷺ إلى الناس جميعاً." },
  { id:"f02-2", unit:99, type:"qa", q:"قارن بينهما من حيث الزمن.", a:"بمعناه العام: دين جميع الأنبياء من نوح إلى أن يرث الله الأرض، ومعناه توحيد الله وإفراده بالعبادة. بمعناه الخاص: الدين الذي ارتضاه الله للناس ولا يقبل ديناً غيره بعد الخاتم ﷺ." },

  { id:"f03-1", unit:99, type:"qa", q:"قارن بين اليهودية والنصرانية من حيث المفهوم.", a:"اليهودية: الديانة الباطلة المحرَّفة عن الدين الحق الذي بعث به موسى لبني إسرائيل. النصرانية: الديانة المحرَّفة التي بُشِّر بها عيسى عليه السلام، ويعتقد أتباعها أن المسيح مات على الصليب ليخلصهم من الخطيئة." },
  { id:"f03-2", unit:99, type:"qa", q:"قارن بينهما من حيث المصدر.", a:"اليهودية: الكتاب المقدس (22 سفراً) + التلمود (المشنا والجمارا). النصرانية: الكتاب المقدس (العهد القديم والجديد) + التقليد الكنسي." },
  { id:"f03-3", unit:99, type:"qa", q:"قارن بينهما من حيث الانحرافات العقدية.", a:"اليهودية: اعتقاد في إله خاص (يهوه)، الكذب على الأنبياء وقتلهم، اعتبار اليهودي من وُلد لأم يهودية، النفعية والوثنية. النصرانية: التثليث، الخطيئة والخلاص، التوسط والتحليل والتحريم عبر رجال الدين." },

  { id:"f04-1", unit:99, type:"qa", q:"قارن بين العهد القديم والعهد الجديد من حيث المفهوم.", a:"العهد الجديد: 27 سفراً تبدأ بالأناجيل الأربعة (متى، مرقس، لوقا، يوحنا) وتضم رسائل بولس وبطرس. العهد القديم: أسفار التناخ اليهودية بتقسيم عددي مغاير عند النصارى." },
  { id:"f04-2", unit:99, type:"qa", q:"قارن بينهما من حيث اعتمادهما مصدراً للتشريع.", a:"العهد الجديد: مصدر تشريع للنصارى فقط، لا يؤمن به اليهود. العهد القديم: مصدر تشريع للنصارى واليهود معاً، مع اختلاف عددي بينهما." },

  { id:"f05-1", unit:99, type:"qa", q:"أين يُستعمل العقل حسب القرآن الكريم؟", a:"في التدبر والتأمل في الكون، وفي العلوم التجريبية كالطب والرياضيات، وفي حل المشكلات والاجتهاد الفقهي فيما لا نص فيه." },
  { id:"f05-2", unit:99, type:"qa", q:"أين لا يُستعمل العقل حسب القرآن الكريم؟", a:"لا يُستعمل في الغيبيات وذات الله وماهية الجنة والنار وحقيقة الروح، ولا في الأمور التعبدية المحضة، ولا في تفسير النصوص بمجرد العقل دون دليل شرعي." },

  { id:"f06-1", unit:99, type:"qa", q:"قارن بين المقاصد الضرورية والحاجية والتحسينية من حيث المفهوم.", a:"الضرورية: ما تقوم عليه حياة الناس، وانعدامها يؤدي إلى الفساد والهلاك (الكليات الخمس). الحاجية: ما يحتاجه الناس من باب التوسعة ورفع الحرج، وفقدانها يُضيّق الحياة دون إيقافها. التحسينية: ما زاد على الضروري والحاجي لتكميل وتجميل أحوال الناس." },
  { id:"f06-2", unit:99, type:"qa", q:"مثّل لكل نوع من أنواع المقاصد الثلاثة.", a:"الضرورية: حفظ الدين والنفس والعقل والنسل والمال. الحاجية: إباحة الأكل عند الضرورة، إباحة الكراء، درء الحدود بالشبهات. التحسينية: تشريع الطهارات، آداب الأكل والشرب، تحريم قطع الشجر في الحروب." },

  { id:"f08-1", unit:99, type:"qa", q:"قارن بين الانحراف والجريمة من حيث المفهوم.", a:"الانحراف: كل سلوك يترتب عليه انتهاك للقيم والمعايير التي تحكم المجتمع. الجريمة: محظورات شرعية زجر الله عنها بحد أو قصاص أو تعزير." },
  { id:"f08-2", unit:99, type:"qa", q:"قارن بينهما من حيث الجزاء.", a:"الانحراف لا يُوصل صاحبه بالضرورة إلى العقاب، وقد يؤدي إلى الجريمة. الجريمة نتيجة انحراف في السلوك، ويعاقَب صاحبها بحد أو قصاص أو تعزير." },

  { id:"f09-1", unit:99, type:"qa", q:"قارن بين الوقاية من الجريمة والعقوبة عليها من حيث التصرف والعلاج.", a:"الوقاية: حارب الإسلام الجريمة قبل وقوعها، بتقوية الإيمان والوازع الديني، والحث على العبادات ومكارم الأخلاق. العقوبة: زواجر للردع بعد الوقوع، وتشمل الحدود والقصاص (والدية بديلة عنه) والتعزير." },

  { id:"f10-1", unit:99, type:"qa", q:"قارن بين الحدود والقصاص والتعزير من حيث المفهوم.", a:"الحد: عقوبة مقدَّرة شرعاً تجب حقاً لله. القصاص: أن يُفعل بالجاني مثلما فعل بالمجني عليه. التعزير: عقوبة غير مقدَّرة شرعاً يقدّرها القاضي حسب المصلحة." },
  { id:"f10-2", unit:99, type:"qa", q:"قارن بينها من حيث أنواعها (أين تكون).", a:"الحدود: في الزنا والسرقة والقذف والخمر والحرابة. القصاص: في الجناية على النفس وما دونها. التعزير: في كل معصية لا حد فيها ولا قصاص." },
  { id:"f10-3", unit:99, type:"qa", q:"قارن بينها من حيث الحق الغالب وإمكانية العفو.", a:"الحدود: حق الله غالب، ولا يجوز العفو فيها بعد بلوغها القاضي. القصاص: حق العبد غالب، ويجوز فيه العفو وقبول الدية أو الصلح. التعزير: منه ما هو حق لله ومنه حق للعبد، والعفو يقرره القاضي حسب المصلحة." },
  { id:"f10-4", unit:99, type:"qa", q:"قارن بينها من حيث كونها مقدَّرة أو غير مقدَّرة.", a:"الحدود والقصاص مقدَّران شرعاً، أما التعزير فغير مقدَّر ويحدده القاضي حسب المصلحة." },

  { id:"f11-1", unit:99, type:"qa", q:"قارن بين القتل العمد والقتل الخطأ من حيث المفهوم والنية.", a:"العمد: بترصد وقصد، بنية القتل مع سبق الإصرار، والنية فيه واضحة وصريحة. الخطأ: نتيجة فعل غير متعمد أو دون قصد، ولا نية فيه للقتل أو الإيذاء." },
  { id:"f11-2", unit:99, type:"qa", q:"قارن بينهما من حيث العقوبة.", a:"العمد: القصاص أو الدية. الخطأ: الدية، وكفارة (صيام شهرين متتابعين)." },

  { id:"f12-1", unit:99, type:"qa", q:"قارن بين القصاص والدية من حيث المفهوم وأين يكون كل منهما.", a:"القصاص: أن يُفعل بالجاني مثلما فعل بالمجني عليه، ويكون في العمد. الدية: المال الواجب بالجناية على النفس أو ما دونها، وتكون في الخطأ أو شبه العمد." },
  { id:"f12-2", unit:99, type:"qa", q:"قارن بينهما من حيث طبيعة العقوبة والتطبيق والمبدأ.", a:"القصاص: عقوبة أصلية، تكون على الجاني نفسه، وقائمة على مبدأ المساواة. الدية: عقوبة بديلة في العمد وأصلية في الخطأ وشبه العمد، تكون على العاقلة في الخطأ، وقائمة على مبدأ تعويض الضرر." },

  { id:"f13-1", unit:99, type:"qa", q:"قارن بين العدل والمساواة من حيث المفهوم في جانب العقاب.", a:"المساواة: عدم التفريق بين الأغنياء والفقراء والأقوياء والضعفاء في تطبيق أحكام الحدود. العدل: إعطاء كل ذي حق حقه." },
  { id:"f13-2", unit:99, type:"qa", q:"قارن بينهما من حيث الهدف والغاية.", a:"هدف المساواة: تحقيق نفس المعاملة بين الجميع لتحقيق التوازن. هدف العدل: تحقيق الإنصاف بناء على الفروق الفردية والحالات الخاصة، حتى لو لم يكن الجميع متساوين." },

  { id:"f14-1", unit:99, type:"qa", q:"قارن بين الشفاعة في الحدود قبل وصول الأمر للقاضي وبعده من حيث الحكم والتسمية.", a:"قبل الوصول للقاضي: تجوز، وتُسمى شفاعة محمودة إذا كان فيها مصلحة، ولا يتعلق بها الحق العام. بعد الوصول للقاضي: لا تجوز، وتُسمى شفاعة مذمومة، ويتعلق بها الحق العام لأنها تمس هيبة الدولة والقانون." },

  { id:"f15-1", unit:99, type:"qa", q:"قارن بين الصحة النفسية والصحة الجسمية من حيث المفهوم وطريقة الحفظ.", a:"النفسية: الحالة التي يكون فيها الإنسان مطمئناً في سلوكه، وتُحفظ بتقوية الصلة بالله وبالتزكية والأخلاق. الجسمية: الحالة التي يكون فيها الإنسان صحيح البدن، وتُحفظ بالوقاية والعلاج والتأهيل والإعفاء من بعض الفرائض." },

  { id:"f16-1", unit:99, type:"qa", q:"قارن بين الوقاية والعلاج والتأهيل من حيث المفهوم ومتى تكون.", a:"الوقاية: حماية الجسم من الأمراض قبل وقوعها. العلاج: التداوي بعد وقوع المرض لاستعادة الصحة. التأهيل: مساعدة الفرد على استعادة قدراته بعد المرض أو الإعاقة، عند تعطل بعض وظائف الجسم." },

  { id:"f17-1", unit:99, type:"qa", q:"قارن بين الإجماع الصريح والسكوتي من حيث المفهوم.", a:"الصريح: أن يظهر كل مجتهد رأيه قولاً أو كتابة بموافقته لآراء الآخرين. السكوتي: أن يظهر بعض المجتهدين رأيهم ويسكت بعضهم دون معرفة موافقتهم أو مخالفتهم." },
  { id:"f17-2", unit:99, type:"qa", q:"قارن بينهما من حيث الحجية.", a:"الصريح: حجة قطعية تفيد العمل ولا يجوز مخالفتها. السكوتي: حجة ظنية، يمكن أن يظهر اجتهاد يخالفه." },

  { id:"f18-1", unit:99, type:"qa", q:"قارن بين الإجماع والقياس والمصالح المرسلة من حيث المفهوم.", a:"الإجماع: اتفاق جميع المجتهدين بعد وفاة الرسول ﷺ على حكم شرعي عملي. القياس: إلحاق مسألة لا نص فيها بمسألة فيها نص، لاشتراكهما في العلة. المصالح المرسلة: استنباط حكم في واقعة لا نص فيها ولا إجماع بناء على مصلحة لا دليل على اعتبارها أو إلغائها." },
  { id:"f18-2", unit:99, type:"qa", q:"قارن بينها من حيث الحجية والمجال.", a:"الإجماع الصريح حجيته قطعية كالقرآن والسنة، ومجاله الأحكام الشرعية العملية. القياس حجة شرعية إذا استوفى شروطه، ومجاله العادات والمعاملات. المصالح المرسلة حجة ظنية، مختلف في حجيتها." },

  { id:"f19-1", unit:99, type:"qa", q:"قارن بين المصلحة المعتبرة والملغاة والمرسلة من حيث المفهوم والمثال.", a:"المعتبرة: توافق مقاصد الشرع، مثالها تشريع القصاص حفظاً للنفس. الملغاة: حكم الشرع بردها، مثالها البيع وقت نداء الجمعة. المرسلة: لا دليل من الشرع على اعتبارها أو إلغائها، مثالها قوانين المرور." },

  { id:"f20-1", unit:99, type:"qa", q:"قارن بين القيم الفردية والأسرية والاجتماعية والسياسية من حيث المفهوم والمثال.", a:"الفردية: يتحلى بها الفرد، كالصدق والحياء والأمانة. الأسرية: يتحلى بها الزوجان، كالمودة والمعاشرة بالمعروف. الاجتماعية: يتحلى بها المجتمع، كالتكافل والتعاون. السياسية: تربط الحاكم بالمحكوم، كالشورى والطاعة والعدل." },

  { id:"f21-1", unit:99, type:"qa", q:"قارن بين الوقف والميراث والوصية من حيث المفهوم.", a:"الوقف: حبس الأصل وتسبيل المنفعة. الميراث: ما يستحقه الوارث من مورثه بسبب من أسباب الإرث. الوصية: تمليك الموصِي مضافاً إلى ما بعد الموت بلا عوض." },
  { id:"f21-2", unit:99, type:"qa", q:"قارن بينها من حيث زمن الانتقال والحكم.", a:"الوقف: يكون في الحياة (وقد يُشترط بعد الموت)، حكمه مندوب. الميراث: لا ينتقل إلا بعد موت المورِّث، وحكمه واجب. الوصية: لا تُنفذ إلا بعد موت الموصِي، وحكمها مندوب." },
  { id:"f21-3", unit:99, type:"qa", q:"قارن بينها من حيث المجال.", a:"الوقف: للأشخاص والمؤسسات. الميراث: للورثة فقط حسب أنصبتهم الشرعية. الوصية: لغير الورثة فقط (ولا تجوز للوارث إلا بإذن الباقين)." },

  { id:"f22-1", unit:99, type:"qa", q:"قارن بين الميراث وعلم الميراث.", a:"الميراث: ما يستحقه الوارث من مورثه بسبب من أسباب الإرث. علم الميراث: العلم الذي يُعرف به من يرث ومن لا يرث ومقدار كل وارث، ويُسمى علم الفرائض." },

  { id:"f23-1", unit:99, type:"qa", q:"قارن بين المورِّث والموروث والوارث.", a:"المورِّث: الميت الذي خلّف تركة. الموروث: ما يتركه الميت من أموال وحقوق تقبل الإرث بعد إخراج حقوق التركة. الوارث: المستحق للإرث بسبب القرابة في النسب أو الزوجية أو العتق." },

  { id:"f24-1", unit:99, type:"qa", q:"قارن بين شروط الميراث وأسبابه وموانعه من حيث المفهوم.", a:"الشروط: ما لا بد من تحققه لاستحقاق الإرث (ثبوت وفاة المورِّث، حياة الوارث بعده، العلم بجهة الإرث). الأسباب: ما يجعل الشخص مستحقاً للإرث (القرابة، النكاح، الولاء). الموانع: أوصاف توجب الحرمان من الميراث، سبعة مجموعة في (عش لك رزق)." },

  { id:"f25-1", unit:99, type:"qa", q:"قارن بين الميراث بالفرض والتعصيب من حيث مفهوم الطريقة.", a:"بالفرض: لهم أنصبة محددة كالثلث والنصف والربع والسدس والثمن والثلثين. بالتعصيب: ليس لهم نصيب محدد، يأخذون كل المال عند الانفراد أو الباقي بعد أصحاب الفروض." },
  { id:"f25-2", unit:99, type:"qa", q:"من يرث بالفرض فقط، ومن يرث بالتعصيب فقط، ومن يرث بهما معاً؟", a:"بالفرض فقط: جميع النساء إلا المعتقة، والزوج، والأخ لأم. بالتعصيب فقط: جميع الرجال إلا الأخ لأم، والمعتقة من النساء. بالفرض والتعصيب معاً: الأب والجد." },

  { id:"f26-1", unit:99, type:"qa", q:"قارن بين البيع والربا من حيث المفهوم والحكم.", a:"البيع: مبادلة مال بمال بتراضٍ ومصلحة مشروعة، وهو مباح. الربا: عقد على عوض غير معلوم التماثل أو مع تأخير في البدلين، وهو محرَّم بالكتاب والسنة والإجماع." },

  { id:"f27-1", unit:99, type:"qa", q:"قارن بين ربا الديون وربا الفضل من حيث المفهوم.", a:"ربا الديون: الزيادة المشروطة التي يأخذها الدائن من المدين نظير التأجيل (ربا الجاهلية). ربا الفضل: بيع مطعومين أو نقدين من جنس واحد مع زيادة أحد البدلين عن الآخر." },
  { id:"f27-2", unit:99, type:"qa", q:"عرّف ربا النسيئة، وما علة كل نوع من هذه الأنواع؟", a:"ربا النسيئة: التأجيل في تسليم أحد البدلين الربويين سواء اتحد جنسهما أم اختلف. علة ربا الديون: الزيادة نظير القرض. علة ربا الفضل والنسيئة: الثمنية في النقدين، والاقتيات والادخار في المطعومات." },

  { id:"f28-1", unit:99, type:"qa", q:"قارن بين الربا وبيع الصرف من حيث المفهوم والحكم.", a:"الربا: عقد على عوض غير معلوم التماثل، محرَّم بنوعيه. بيع الصرف: بيع الذهب بالفضة أو بالنقود، مباح إذا كان مثلاً بمثل يداً بيد عند اتحاد العملة، ويجوز التفاضل مع الفورية عند اختلافها." },

  { id:"f29-1", unit:99, type:"qa", q:"قارن بين بيع الصرف والمرابحة والتقسيط من حيث المبيع والتقابض.", a:"الصرف: مبيعه الذهب والفضة والنقود، وتقابضه واجب فوراً. المرابحة: مبيعها السلع، ولا يُشترط فيها التقابض الفوري. التقسيط: مبيعه السلع، والسلعة فيه مقدَّمة والثمن مؤجل بأقساط معلومة." },

  { id:"f30-1", unit:99, type:"qa", q:"قارن بين المرابحة والمرابحة للآمر بالشراء من حيث المفهوم.", a:"المرابحة: بيع ما اشترى بثمنه مع ربح معلوم، بمبادرة من البائع دون طلب من المشتري. المرابحة للآمر بالشراء: يشتري البنك ما يطلبه العميل مقابل التزام العميل بالشراء وفق الربح المتفق عليه." },
  { id:"f30-2", unit:99, type:"qa", q:"قارن بينهما من حيث الإلزام في العقد.", a:"المرابحة العادية غير ملزمة للمشتري، يختار الشراء أو لا بعد رؤية السلعة. المرابحة للآمر بالشراء تُعتبر ملزمة بعد الاتفاق، ولا يمكن للآمر التراجع." },

  { id:"f31-1", unit:99, type:"qa", q:"قارن بين تغيير المنكر باليد وباللسان من حيث المفهوم.", a:"باليد: إزالة المنكر أو منعه بالقوة المادية كالإتلاف أو الطرد. باللسان: إنكار المنكر بالقول، كالنصيحة أو التحذير، دون استخدام القوة." },
  { id:"f31-2", unit:99, type:"qa", q:"عرّف تغيير المنكر بالقلب، ومن المكلف بكل مرتبة من المراتب الثلاث؟", a:"بالقلب: كراهية المنكر مع اجتنابه وإن لم يستطع تغييره، وهو أضعف الإيمان. المكلف باليد: الأمراء وولاة الأمر. المكلف باللسان: العلماء والدعاة وكل قادر على النصح. المكلف بالقلب: كل مسلم حتى العاجز والضعيف." },

  { id:"f32-1", unit:99, type:"qa", q:"قارن بين التبني والكفالة من حيث المفهوم والحكم.", a:"التبني: أن يتخذ الإنسان ولد غيره ابناً له فيجعله كالابن من النسب الصحيح، وحكمه التحريم. الكفالة: الالتزام بالقيام على شؤون المكفول وتربيته ورعايته، وحكمها الاستحباب." },
  { id:"f32-2", unit:99, type:"qa", q:"قارن بينهما من حيث الجزاء والنتائج.", a:"التبني: يستحق المتبني الإثم، ونتيجته اختلاط الأنساب وأخذ حق الغير في الميراث. الكفالة: يستحق الكفيل الأجر والثواب، ونتيجتها المحافظة على النسب الأصلي." },

  // ---------- سندات قرآنية إضافية: الوحدة 2 (وسائل تثبيت العقيدة) ----------
  { id:"q2-01", unit:2, type:"cloze", q:"أكمل الآية: ﴿هُوَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۚ يَعْلَمُ مَا يَلِجُ فِي الْأَرْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ السَّمَاءِ وَمَا يَعْرُجُ فِيهَا ۖ وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ ۚ وَاللَّهُ بِمَا تَعْمَلُونَ ___﴾ [الحديد: 4]", a:"بَصِيرٌ", ctx:"التذكير بمراقبة الله لخلقه (الوسيلة الأولى من وسائل تثبيت العقيدة)" },
  { id:"q2-02", unit:2, type:"cloze", q:"أكمل الآية: ﴿خَلَقَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا وَأَلْقَىٰ فِي الْأَرْضِ رَوَاسِيَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَابَّةٍ ۚ وَأَنزَلْنَا مِنَ السَّمَاءِ مَاءً فَأَنبَتْنَا فِيهَا مِن كُلِّ زَوْجٍ ___﴾ [لقمان: 10]", a:"كَرِيمٍ", ctx:"إثارة العقل والوجدان (الوسيلة الثانية من وسائل تثبيت العقيدة)" },
  { id:"q2-03", unit:2, type:"cloze", q:"أكمل الآية: ﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ ___ الَّذِينَ يُنفِقُونَ فِي السَّرَّاءِ وَالضَّرَّاءِ وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ﴾ [آل عمران: 133-134]", a:"لِلْمُتَّقِينَ", ctx:"رسم الصور المحببة للمؤمنين (الوسيلة الثالثة من وسائل تثبيت العقيدة)" },
  { id:"q2-04", unit:2, type:"cloze", q:"أكمل الآية: ﴿قُلْ مَن رَّبُّ السَّمَاوَاتِ السَّبْعِ وَرَبُّ الْعَرْشِ الْعَظِيمِ سَيَقُولُونَ لِلَّهِ ۚ قُلْ أَفَلَا ___﴾ [المؤمنون: 86-87]", a:"تَتَّقُونَ", ctx:"مناقشة الانحرافات (الوسيلة الخامسة من وسائل تثبيت العقيدة)" },

  // ---------- سندات قرآنية إضافية: الوحدة 7 (العقل في القرآن الكريم) ----------
  { id:"q7-01", unit:7, type:"cloze", q:"أكمل الآية: ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُم مِّنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِّمَّنْ خَلَقْنَا ___﴾ [الإسراء: 70]", a:"تَفْضِيلًا", ctx:"أهمية العقل ومنزلته في القرآن الكريم" },
  { id:"q7-02", unit:7, type:"cloze", q:"أكمل الآية: ﴿إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ وَالْفُلْكِ الَّتِي تَجْرِي فِي الْبَحْرِ بِمَا يَنفَعُ النَّاسَ... لَآيَاتٍ لِّقَوْمٍ ___﴾ [البقرة: 164]", a:"يَعْقِلُونَ", ctx:"أهمية العقل — التدبر في الكون كوسيلة للنظر" },
  { id:"q7-03", unit:7, type:"cloze", q:"أكمل الآية: ﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا ___ شَيْئًا وَلَا يَهْتَدُونَ﴾ [البقرة: 170]", a:"يَعْقِلُونَ", ctx:"دور العقل في تمحيص الأفكار والموروثات — إنكار التقليد الأعمى للآباء" },
  { id:"q7-04", unit:7, type:"cloze", q:"أكمل الآية: ﴿هَٰؤُلَاءِ قَوْمُنَا اتَّخَذُوا مِن دُونِهِ آلِهَةً ۖ لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَانٍ بَيِّنٍ ۖ فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ ___﴾ [الكهف: 15]", a:"كَذِبًا", ctx:"دور العقل في تمحيص الأفكار والموروثات — مناقشة عبادة غير الله بلا برهان" },
  { id:"q7-05", unit:7, type:"cloze", q:"أكمل الآية: ﴿أَلَا إِنَّ لِلَّهِ مَن فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ ۗ وَمَا يَتَّبِعُ الَّذِينَ يَدْعُونَ مِن دُونِ اللَّهِ شُرَكَاءَ ۚ إِن يَتَّبِعُونَ إِلَّا ___﴾ [يونس: 66]", a:"الظَّنَّ", ctx:"دور العقل في تمحيص الأفكار والموروثات — اتباع الظن في الشرك بالله" },
  { id:"q7-06", unit:7, type:"cloze", q:"أكمل الآية: ﴿وَقَالُوا مَا هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا يُهْلِكُنَا إِلَّا ___﴾ [الجاثية: 24]", a:"الدَّهْرُ", ctx:"دور العقل في تمحيص الأفكار والموروثات — الرد على منكري البعث" },

  // ---------- سندات قرآنية إضافية: الوحدة 11 (الصحة النفسية والجسمية) ----------
  { id:"q11-01", unit:11, type:"cloze", q:"أكمل الآية: ﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا ___﴾ [المؤمنون: 115]", a:"تُرْجَعُونَ", ctx:"الفهم الصحيح للوجود والمصير (من طرق حفظ الصحة النفسية)" },
  { id:"q11-02", unit:11, type:"cloze", q:"أكمل الآية: ﴿الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ ___ الْقُلُوبُ﴾ [الرعد: 28]", a:"تَطْمَئِنُّ", ctx:"تقوية الصلة بالله بالذكر والعبادات (من طرق حفظ الصحة النفسية)" },
  { id:"q11-03", unit:11, type:"cloze", q:"أكمل الآية: ﴿قَدْ أَفْلَحَ مَن زَكَّاهَا * وَقَدْ خَابَ مَن ___﴾ [الشمس: 9-10]", a:"دَسَّاهَا", ctx:"التزكية والأخلاق (من طرق حفظ الصحة النفسية)" },
  { id:"q11-04", unit:11, type:"cloze", q:"أكمل الآية: ﴿وَلَا تَقْرَبُوا الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ ___﴾ [الإسراء: 32]", a:"سَبِيلًا", ctx:"الوقاية — تحريم تناول الخبائث واقتراف الفواحش (من طرق حفظ الصحة الجسمية)" },
  { id:"q11-05", unit:11, type:"cloze", q:"أكمل الآية: ﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ ___﴾ [الأعراف: 31]", a:"الْمُسْرِفِينَ", ctx:"الوقاية — الاعتدال في المأكل والمشرب (من طرق حفظ الصحة الجسمية)" },
  { id:"q11-06", unit:11, type:"cloze", q:"أكمل الآية: ﴿...يَخْرُجُ مِن بُطُونِهَا شَرَابٌ مُّخْتَلِفٌ أَلْوَانُهُ فِيهِ ___ لِّلنَّاسِ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِّقَوْمٍ يَتَفَكَّرُونَ﴾ [النحل: 68-69]", a:"شِفَاءٌ", ctx:"الوقاية/العلاج — العسل شفاء للناس (من طرق حفظ الصحة الجسمية)" },
  { id:"q11-07", unit:11, type:"cloze", q:"أكمل الآية: ﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن ___ وَمِن رِّبَاطِ الْخَيْلِ تُرْهِبُونَ بِهِ عَدُوَّ اللَّهِ وَعَدُوَّكُمْ﴾ [الأنفال: 60]", a:"قُوَّةٍ", ctx:"ممارسة الرياضة النافعة (من طرق حفظ الصحة الجسمية)" },

  // ---------- سندات قرآنية إضافية: الوحدة 15 (القيم في القرآن الكريم) ----------
  { id:"q15-01", unit:15, type:"cloze", q:"أكمل الآية: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ ___﴾ [التوبة: 119]", a:"الصَّادِقِينَ", ctx:"قيمة الصدق (من القيم الفردية)" },
  { id:"q15-02", unit:15, type:"cloze", q:"أكمل الآية: ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا ___﴾ [النساء: 58]", a:"بِالْعَدْلِ", ctx:"قيمة الأمانة (فردية) وقيمة العدل (سياسية) معاً" },
  { id:"q15-03", unit:15, type:"cloze", q:"أكمل الآية: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً ___﴾ [الروم: 21]", a:"وَرَحْمَةً", ctx:"المودة والرحمة (من القيم الأسرية)" },
  { id:"q15-04", unit:15, type:"cloze", q:"أكمل الآية: ﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَيَجْعَلَ اللَّهُ فِيهِ خَيْرًا ___﴾ [النساء: 19]", a:"كَثِيرًا", ctx:"المعاشرة بالمعروف (من القيم الأسرية)" },
  { id:"q15-05", unit:15, type:"cloze", q:"أكمل الآية: ﴿يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ ___﴾ [النساء: 1]", a:"وَاحِدَةٍ", ctx:"التكافل الاجتماعي (من القيم الاجتماعية)" },
  { id:"q15-06", unit:15, type:"cloze", q:"أكمل الآية: ﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى ___ وَالْعُدْوَانِ﴾ [المائدة: 2]", a:"الْإِثْمِ", ctx:"التعاون (من القيم الاجتماعية)" },
  { id:"q15-07", unit:15, type:"cloze", q:"أكمل الآية: ﴿وَالَّذِينَ اسْتَجَابُوا لِرَبِّهِمْ وَأَقَامُوا الصَّلَاةَ وَأَمْرُهُمْ ___ بَيْنَهُمْ﴾ [الشورى: 38]", a:"شُورَىٰ", ctx:"الشورى (من القيم السياسية)" },
  { id:"q15-08", unit:15, type:"cloze", q:"أكمل الآية: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي ___ مِنكُمْ﴾ [النساء: 59]", a:"الْأَمْرِ", ctx:"الطاعة (من القيم السياسية)" },
  { id:"q15-09", unit:15, type:"cloze", q:"أكمل الآية: ﴿فَجَاءَتْهُ إِحْدَاهُمَا تَمْشِي عَلَى ___ قَالَتْ إِنَّ أَبِي يَدْعُوكَ لِيَجْزِيَكَ أَجْرَ مَا سَقَيْتَ لَنَا﴾ [القصص: 25]", a:"اسْتِحْيَاءٍ", ctx:"قيمة الحياء (من القيم الفردية)" },

  // ---------- إضافات المراجعة الثانية: أقسام الأحكام والفوائد الختامية ----------
  { id:"u2-16", unit:2, type:"qa", q:"اذكر أحكاماً مستفادة من آية ﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ...﴾ [آل عمران: 133-134].", a:"وجوب تعجيل التوبة وفعل الطاعات وعدم التسويف فيها، واستحباب الإنفاق في سبيل الله ولو بالقليل، واستحباب كظم الغيظ وتحمل الأذى والعفو عن المسيء وترك الانتقام." },
  { id:"u2-17", unit:2, type:"qa", q:"اذكر فوائد مستفادة من نفس الآية (آل عمران: 133-134).", a:"المتقون هم أهل الجنة وورثتها، والاعتدال في الإنفاق من صفات المحسنين، والعفو من شيم المؤمنين." },

  { id:"u7-07", unit:7, type:"qa", q:"اذكر أحكاماً مستفادة من آية ﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ...﴾ [البقرة: 170].", a:"وجوب اتباع الكتاب والسنة والعمل بأحكامهما، وحرمة تقليد من لا علم له ولا بصيرة في الدين، ووجوب تدبر القرآن الكريم عند تلاوته أو سماعه لفهمه والاتعاظ به." },
  { id:"u7-08", unit:7, type:"qa", q:"اذكر فوائد مستفادة من نفس الآية (البقرة: 170).", a:"القلوب القاسية ميتة لا تعي ولا تعتبر، وإذا صلحت القلوب صلح حال الناس وإذا فسدت فسدت أحوالهم، وذم التقليد الأعمى والدعوة إلى استخدام العقل." },

  { id:"u9-19", unit:9, type:"qa", q:"اذكر مضامين خاصية (الرزانة في العقوبة).", a:"مراعاة الفروق الفردية في إيقاع العقوبة على المريض والضعيف والحامل، ودرء الحدود بالشبهات، والتشديد في شروط تنفيذ العقوبة، وتشريع الدية." },

  { id:"u10-09", unit:10, type:"qa", q:"اذكر حكمين مستفادين من حديث المساواة أمام أحكام الشريعة.", a:"تحريم جريمة السرقة وبيان عقوبتها، وتحريم الشفاعة في الحدود." },
  { id:"u10-10", unit:10, type:"qa", q:"اذكر فائدتين مستفادتين من نفس الحديث.", a:"الدعوة لأخذ العبرة من الأمم السابقة، وعظم منزلة فاطمة عند أبيها." },

  { id:"u11-08", unit:11, type:"qa", q:"اذكر أحكاماً مستفادة من آية ﴿إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ...﴾ [النحل: 115].", a:"تحريم كل ما يضر الجسم من طعام أو شراب، وتحريم الشرك بالله، وجواز تناول بعض المحرمات عند الضرورة، وتحريم الأكل مما ذُبح لغير الله." },
  { id:"u11-09", unit:11, type:"qa", q:"اذكر فوائد مستفادة من نفس الآية (النحل: 115).", a:"سعة مغفرة الله ورحمته بعباده، والضرورات تبيح المحظورات، والوقاية من الأمراض من أسس الرعاية الصحية." },

  { id:"u15-12", unit:15, type:"qa", q:"اذكر أحكاماً مستفادة من آية ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ...﴾ [النساء: 59].", a:"وجوب طاعة الله، ووجوب طاعة الرسول، ووجوب رد الأمر إلى الله ورسوله عند التنازع." },
  { id:"u15-13", unit:15, type:"qa", q:"اذكر فوائد مستفادة من نفس الآية (النساء: 59).", a:"الدعوة إلى طاعة أولي الأمر في غير معصية، وبيان مصادر التشريع الإسلامي، وكل الخير في اتباع الكتاب والسنة، ومن علامات الإيمان الاحتكام إلى الكتاب والسنة." },

  { id:"u16-10", unit:16, type:"qa", q:"من هو الصحابي راوي حديث الوقف؟", a:"أبو هريرة عبد الرحمن بن صخر الدوسي (نسبته لقبيلة دوس)، أسلم سنة 7هـ، لازم النبي ﷺ ملازمة تامة، روى 5374 حديثاً، أكثر الصحابة حفظاً ورواية للحديث، توفي سنة 57هـ." },
  { id:"u16-11", unit:16, type:"qa", q:"اذكر حكمين مستفادين من حديث الوقف.", a:"مشروعية الوقف في الإسلام، واستحباب المسارعة في فعل الخير." },
  { id:"u16-12", unit:16, type:"qa", q:"اذكر فائدتين مستفادتين من نفس الحديث.", a:"عظم أجر العلم النافع وتوريثه للأجيال، وبيان أهمية حسن تربية الأبناء عند الله." },

/* ============================================================
   أدوات مساعدة للتاريخ والجدولة (خوارزمية مبسّطة من نوع SM-2)
   ============================================================ */
// كل دوال التاريخ هنا تعمل بالتوقيت المحلي للجهاز (وليس UTC)، لتفادي أي انزياح
// بيوم كامل حول منتصف الليل حسب المنطقة الزمنية للمستخدم — دون تخمين المنطقة،
// بل بالاعتماد على توقيت الجهاز نفسه تلقائياً.
function pad2(n){ return String(n).padStart(2, "0"); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function addDays(dateStr, days){
  const [y, m, day] = dateStr.split("-").map(Number);
  const d = new Date(y, m - 1, day); // محلي بالكامل، بلا تحويل UTC
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function daysBetween(dateA, dateB){
  const da = new Date(dateA + "T00:00:00");
  const db = new Date(dateB + "T00:00:00");
  return Math.round((db - da) / 86400000);
}
function initCardState(seed, order){
  return { ...seed, order, interval:0, repetitions:0, ease:2.5, due:todayStr(), isNew:true, stab:null, lastDate:null };
}
// grade: 0 = صعب (فشل/إعادة)، 1 = متوسط (جيد)، 2 = سهل (ممتاز)
// كل يوم له نوع واحد من ثلاثة: "review" مراجعة، "both" درس + مراجعة (جلستان بزرّين منفصلين)، "holiday" عطلة.
// لا يوجد يوم "درس فقط" ولا "بلا تحديد": المراجعة تجري في كل يوم دراسة لأن المواعيد تصل بحسب الخوارزمية.
const DAY_TYPES = ["review","both","holiday"];
const DAY_TYPE_LABEL = { review:"مراجعة", both:"درس + مراجعة", holiday:"عطلة" };
const WEEKDAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DEFAULT_DAY_TYPES = ["review","review","review","review","review","both","holiday"]; // نفس افتراض بقية التطبيقات
function weekdayOf(dateStr){
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).getDay();
}
function dayTypeOn(dateStr){ return (settings.dayTypes || DEFAULT_DAY_TYPES)[weekdayOf(dateStr)]; }
function dayHasLesson(type){ return type === "both"; }
function dayHasReview(type){ return type === "review" || type === "both"; }
// يدفع تاريخاً إلى أقرب يوم مراجعة (مراجعة أو درس + مراجعة) — هكذا تُحترم العطلة في الجدولة نفسها.
// إن كانت كل الأيام عطلة (حالة غير منطقية) يُعاد التاريخ كما هو دون حلقة لا نهائية.
function nextAllowedDay(dateStr){
  const types = settings.dayTypes || DEFAULT_DAY_TYPES;
  if (!types.some(dayHasReview)) return dateStr;
  let d = dateStr, guard = 0;
  while (!dayHasReview(types[weekdayOf(d)]) && guard < 8){
    d = addDays(d, 1);
    guard++;
  }
  return d;
}
// الوضع الخفيف (أسابيع الضغط): ينصّف جلسة الدرس الجديد فقط حتى تاريخ محدد ثم ينتهي وحده — لا يمسّ المراجعة أبداً
function isLightModeOn(dateStr){
  return !!(settings.lightModeUntil && (dateStr || todayStr()) <= settings.lightModeUntil);
}
// ---------- موعد الامتحان، «جاهزة»، والمراجعة الختامية (بتعريفات أستاذ العلوم) ----------
const EXAM_WINDOW = 30;
function lastOkOf(c){ return c.lastOk || (c.stab ? c.lastDate : null); } // المتقنة القديمة: آخر مراجعة لها نجاح حتماً
function examStart(){ return settings.examDate ? addDays(settings.examDate, -EXAM_WINDOW) : null; }
// «جاهزة»: متقنة، وآخر نجاح لها داخل آخر 30 يوماً قبل الامتحان، واليوم داخل النافذة — وصفر خارجها
function isExamReady(c){
  const start = examStart();
  if (!start || todayStr() < start) return false;
  const ok = lastOkOf(c);
  return !!c.stab && !!ok && ok >= start && ok <= settings.examDate;
}
function finalReviewActive(){
  if (!settings.examDate || settings.finalReview === false) return false;
  const t = todayStr();
  return t >= examStart() && t < settings.examDate;
}
// بطاقات الختامية: سبقت دراستها، لم يحن موعدها، ولم تُتذكَّر بنجاح داخل النافذة — الأقدم مشاهدةً أولاً
function finalReviewExtras(pool){
  if (!finalReviewActive()) return [];
  const t = todayStr(), start = examStart();
  return pool.filter(c => !c.isNew && c.due > t && !((lastOkOf(c) || "") >= start))
    .sort((a, b) => ((a.lastSeen || a.lastDate || "") < (b.lastSeen || b.lastDate || "") ? -1 : 1));
}
function effectiveMinutes(field, dateStr){
  const base = settings[field] || 0;
  return (field === "lessonMinutes" && isLightModeOn(dateStr)) ? Math.floor(base / 2) : base;
}

// خوارزمية الجدولة الموحّدة (مطابقة حرفياً لنظام SM-2 المعتمد في كل تطبيقاتك):
// الفاصلان الأول والثاني يتفاوتان بحسب جودة الإجابة لا يوماً واحداً للجميع،
// ومعامل السهولة يُحدَّث بنفس الصيغة دائماً. هذه الدالة الوحيدة التي تُستعمل
// للجلسة الفعلية والمحاكاة معاً (عبر وسيط asOf) فلا يوجد نسخة ثانية من الحساب.
// "الإتقان الحقيقي" (بطاقة راسخة) محسوب هنا بنفس تعريفك المعتمد في كل تطبيقاتك:
// نجاح بعد فاصل 14 يوماً فأكثر منذ آخر مراجعة فعلية، لا بطول الفاصلة المجدولة
// وحدها (موعد بعيد لا يعني حفظاً)، وتُنسى إن أُخفقت بعد ثبوتها.
const STABLE_GAP_SH = 14;
function schedule(card, grade, asOf){
  asOf = asOf || todayStr();
  const quality = [2, 3, 4, 5][grade] ?? 4; // إعادة/صعب/جيد/سهل — مطابق لأستاذ العلوم
  let { repetitions, interval, ease, stab, lastDate } = card;
  const gap = lastDate ? daysBetween(lastDate, asOf) : null;
  if (quality < 3){
    repetitions = 0; interval = 1;
    if (stab) stab = null;
  } else {
    if (repetitions === 0) interval = (quality === 5) ? 4 : (quality === 4 ? 2 : 1);
    else if (repetitions === 1) interval = (quality === 5) ? 10 : (quality === 4 ? 6 : 3);
    else interval = Math.max(interval + 1, Math.round(interval * ease));
    repetitions += 1;
    if (gap !== null && gap >= STABLE_GAP_SH && !stab) stab = asOf;
  }
  ease = Math.max(1.3, ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  const due = nextAllowedDay(addDays(asOf, interval));
  return { ...card, repetitions, interval, ease, due, isNew:false, stab, lastDate: asOf, lastSeen: asOf, lastOk: quality >= 3 ? asOf : card.lastOk };
}

/* مفاتيح فريدة لهذا التطبيق (القديمة islamic-srs-* عامة قد يستعملها تطبيق آخر في المتصفح نفسه) */
const STORAGE_KEY = "bac_sharia_cards_v1";
const STATS_KEY = "bac_sharia_stats_v1";
const LEGACY_KEY_MAP = [["islamic-srs-cards-v1","bac_sharia_cards_v1"],["islamic-srs-stats-v1","bac_sharia_stats_v1"],["islamic-srs-settings-v1","bac_sharia_settings_v1"]];
/* تهجير مرة واحدة: نسخٌ لا نقل، وبعد التحقق أن البطاقات المحفوظة بطاقات هذا التطبيق فعلاً (معرّفات مثل u1-01) */
async function migrateShariaKeys(){
  try {
    const cur = await window.storage.get("bac_sharia_cards_v1", false).catch(() => null);
    if (cur) return;
    const old = await window.storage.get("islamic-srs-cards-v1", false).catch(() => null);
    if (!old) return;
    const parsed = JSON.parse(old.value);
    if (!parsed || !Object.keys(parsed).some(k => /^u\d+-\d+$/.test(k))) return;
    for (const [o, n] of LEGACY_KEY_MAP){
      const v = await window.storage.get(o, false).catch(() => null);
      if (v) await window.storage.set(n, v.value, false);
    }
  } catch(e){ console.error("تعذّر نقل البيانات إلى المفاتيح الجديدة", e); }
}
async function loadCards(){
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    return res ? JSON.parse(res.value) : {};
  } catch { return {}; }
}
async function saveCards(map){
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(map), false); }
  catch(e){ console.error("تعذّر الحفظ", e); }
}
const DEFAULT_STATS = { totalReviews:0, streak:0, lastActiveDate:null, lastSeenDate:null, missedCount:0, newWeekKey:null, newWeekCount:0, lessonSessionsDate:null, lessonSessionsCount:0, reviewSessionDate:null, lessonDoneDate:null, lessonDoneCount:0, reviewDoneDate:null, reviewDoneCount:0, missedDates:[], lessonSecDate:null, lessonSec:0, reviewSecDate:null, reviewSec:0, lastRebalanceDate:null };
/* ============================================================
   تعديلات المحتوى: مفتاح مستقل، والنص الأصلي في الكود لا يُمسّ.
   تُعرض النصوص دائماً من الكود ثم يُطبَّق التعديل فوقها، ويُصدَّر ملف يحمل كل تعديل بمكانه الدقيق
   ============================================================ */
const EDITS_KEY = "bac_sharia_edits_v1";
const EDIT_FIELDS = { q:"السؤال", a:"الجواب", ctx:"موضع الاستشهاد" };
let contentEdits = {};   // {id:{q?, a?, ctx?, at}}
let _seedById = null;
function seedOf(id){ if (!_seedById){ _seedById = {}; SEED_CARDS.forEach(c => { _seedById[c.id] = c; }); } return _seedById[id] || null; }
function sanitizeEdits(obj){
  const out = {};
  if (!obj || typeof obj !== "object") return out;
  Object.keys(obj).forEach(id => {
    const e = obj[id]; if (!e || !seedOf(id)) return;
    const r = {};
    Object.keys(EDIT_FIELDS).forEach(f => { if (typeof e[f] === "string") r[f] = e[f].slice(0, 3000); });
    if (Object.keys(r).length){ r.at = typeof e.at === "string" ? e.at : todayStr(); out[id] = r; }
  });
  return out;
}
/* ============================================================
   الدفتر بمواصفات «التاريخ والجغرافيا»: ربط ثلاثي (مستقلة/بدرس/ببطاقة)، وسوم، بحث فوري، تثبيت،
   أرشفة، مجلدات، وتحويل الملاحظة إلى بطاقة حفظ حقيقية مستقلة عنها تدخل المراجعة فعلاً
   ============================================================ */
const NOTEBOOK_KEY = "bac_sharia_notebook_v1";
const NOTE_TAGS = ["مهم","ملتبس","مصطلح","منهجية","وارد في البكالوريا"];
let notebook = { notes:{}, folders:{}, userCards:{} };
function lessonIds(){ return Object.keys(UNIT_NAMES).map(Number).filter(u => u !== 99); }
function sanitizeNotebook(o){
  const out = { notes:{}, folders:{}, userCards:{} };
  if (!o || typeof o !== "object") return out;
  const lessons = new Set(lessonIds());
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";
  Object.values(o.folders || {}).forEach(f => { if (f && typeof f.id === "string" && typeof f.name === "string") out.folders[f.id] = { id:f.id, name:f.name.slice(0,40) }; });
  Object.values(o.userCards || {}).forEach(c => {
    if (c && typeof c.id === "string" && lessons.has(c.unit) && typeof c.q === "string" && typeof c.a === "string")
      out.userCards[c.id] = { id:c.id, unit:c.unit, q:c.q.slice(0,2000), a:c.a.slice(0,4000), fromNoteId: typeof c.fromNoteId === "string" ? c.fromNoteId : null, createdAt: str(c.createdAt,10) || todayStr() };
  });
  Object.values(o.notes || {}).forEach(n => {
    if (!n || typeof n.id !== "string") return;
    // تهجير صيغة النسخة السابقة: cardRef → ربط ببطاقة، unit → ربط بدرس، folder → folderId، وبطاقتها (cq/ca) → بطاقة مستقلة بالمعرّف نفسه فلا يضيع تقدّمها
    let linkType = n.linkType, itemId = n.itemId, unit = n.unit;
    if (!["standalone","lesson","card"].includes(linkType)){
      if (typeof n.cardRef === "string"){ linkType = "card"; itemId = n.cardRef; }
      else if (typeof n.unit === "number") linkType = "lesson";
      else linkType = "standalone";
    }
    unit = lessons.has(unit) ? unit : null;
    if (linkType === "card" && typeof itemId !== "string") linkType = "standalone";
    if (linkType === "lesson" && unit === null) linkType = "standalone";
    const folderRaw = typeof n.folderId === "string" ? n.folderId : n.folder;

const SCHOOL_EXAM_KINDS = { fard:"فرض", ikhtibar:"اختبار فصلي", tajribi:"بكالوريا تجريبية" };
function schoolUnitIds(){ return Object.keys(UNIT_NAMES).map(Number).filter(u => u !== 99); }
function sanitizeSchoolExams(obj){
  const out = {};
  if (!obj || typeof obj !== "object") return out;
  const valid = new Set(schoolUnitIds());
  Object.values(obj).forEach(ex => {
    if (!ex || typeof ex.id !== "string" || !SCHOOL_EXAM_KINDS[ex.kind]) return;
    if (typeof ex.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(ex.date)) return;
    const units = Array.isArray(ex.units) ? [...new Set(ex.units.map(Number).filter(u => valid.has(u)))] : [];
    if (!units.length) return;
    out[ex.id] = { id:ex.id, kind:ex.kind, title: typeof ex.title === "string" ? ex.title.slice(0,60) : "", date:ex.date, units, prioritized: ex.prioritized === true };
  });
  return out;
}
function schoolExamsSorted(){
  const t = todayStr(), all = Object.values(settings.schoolExams || {});
  const up = all.filter(e => e.date >= t).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const past = all.filter(e => e.date < t).sort((a,b) => a.date > b.date ? -1 : a.date < b.date ? 1 : 0);
  return up.concat(past);
}
/* رتبة كل درس مقدَّم: موعد أقرب = رتبة أصغر. extraExamId لمحاكاة «ماذا لو قُدِّم» دون حفظ شيء */
function prioritizedUnitRank(extraExamId){
  const rank = {};
  if (settings.studentType !== "school") return rank;
  const t = todayStr();
  Object.values(settings.schoolExams || {})
    .filter(e => e.date >= t && (e.prioritized || e.id === extraExamId))
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
    .forEach((e, i) => e.units.forEach(u => { if (!(u in rank)) rank[u] = i; }));
  return rank;
}
/* دالة الترتيب الوحيدة للبطاقات الجديدة: تستعملها الجلسة الفعلية والمحاكاة حرفياً */
function newCardOrder(list, extraExamId){
  const rank = prioritizedUnitRank(extraExamId);
  const r = c => (c.unit in rank) ? rank[c.unit] : Infinity;
  return list.sort((a,b) => (r(a) - r(b)) || ((a.order ?? 0) - (b.order ?? 0)));
}
function dayCountAr(n){
  if (n === 1) return "يوم واحد";
  if (n === 2) return "يومين";
  const r = n % 100;
  if (n >= 100 && r <= 2) return n + " يوم";
  if (r >= 3 && r <= 10) return n + " أيام";
  return n + " يوماً";
}

function daysLeftPhraseAr(d){

}

function schoolSim(extraExamId){
  const key = [todayStr(), JSON.stringify(settings), JSON.stringify(stats), getAllCards().filter(c => !c.isNew).length, getAllCards().filter(c => c.stab).length].join("|");

function evaluateSchoolExam(ex, sim){
  let fin = 0, mat = 0, finKnown = true, matKnown = true;
  ex.units.forEach(u => {
    const f = sim.unitFinish[u], m = sim.unitMature[u];
    if (f === null || f === undefined) finKnown = false; else fin = Math.max(fin, f);
    if (m === null || m === undefined) matKnown = false; else mat = Math.max(mat, m);
  });
  const finishDate = finKnown ? addDays(todayStr(), fin) : null;
  const matureDate = (finKnown && matKnown) ? addDays(todayStr(), mat) : null;
  return { finishDate, matureDate,
    finishOk: finishDate ? finishDate < ex.date : false,   // تكتمل القراءة قبل يوم الموعد نفسه
    matureOk: matureDate ? matureDate < ex.date : false,
    alreadyAll: finKnown && fin === 0 && matKnown && mat === 0 };
}
function schoolExamTitle(ex){ return SCHOOL_EXAM_KINDS[ex.kind] + (ex.title ? " · " + ex.title : ""); }
function normalizeSettings(loaded){
  loaded = loaded || {};
  const s = { ...DEFAULT_SETTINGS, ...loaded };
  const validTypes = Array.isArray(loaded.dayTypes) && loaded.dayTypes.length === 7 && loaded.dayTypes.every(x => DAY_TYPES.includes(x));
  if (validTypes){
    s.dayTypes = [...loaded.dayTypes];
  } else {
    const L = Array.isArray(loaded.lessonDays) ? loaded.lessonDays : (Array.isArray(loaded.studyDays) ? loaded.studyDays : null);
    const R = Array.isArray(loaded.reviewDays) ? loaded.reviewDays : (Array.isArray(loaded.studyDays) ? loaded.studyDays : null);
    if (L || R){
      // يوم فيه درس (مع مراجعة أو بدونها) يصير "درس + مراجعة" لأن المراجعة لا تغيب عن يوم دراسة؛ يوم مراجعة فقط يبقى مراجعة؛ الباقي عطلة
      s.dayTypes = [0,1,2,3,4,5,6].map(i => (L && L[i]) ? "both" : ((R && R[i]) ? "review" : "holiday"));
      if (s.dayTypes.every(x => x === "holiday")) s.dayTypes = [...DEFAULT_DAY_TYPES];
    } else {
      s.dayTypes = [...DEFAULT_DAY_TYPES];
    }
  }
  if (loaded.sessionMinutes && loaded.lessonMinutes === undefined && loaded.reviewMinutes === undefined){
    s.lessonMinutes = loaded.sessionMinutes;
    s.reviewMinutes = loaded.sessionMinutes;
  }
  // الوضع الخفيف القديم كان مفتاحاً بلا مدة: يُحوَّل إلى أسبوعين من اليوم بدل أن يضيع
  if (loaded.lightMode === true && !loaded.lightModeUntil) s.lightModeUntil = addDays(todayStr(), 13);
  if (typeof s.lightModeUntil !== "string" || s.lightModeUntil < todayStr()) s.lightModeUntil = null;
  // التجميد القديم كان شاملاً: يصير تجميداً للدرس وللمراجعة معاً بنفس التاريخ
  if (loaded.frozenSince && !loaded.frozenLessonSince && !loaded.frozenReviewSince){
    s.frozenLessonSince = loaded.frozenSince;
    s.frozenReviewSince = loaded.frozenSince;
  }
  if (typeof s.examDate !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s.examDate)) s.examDate = null;
  if (typeof s.finalReview !== "boolean") s.finalReview = true;
  if (!["school","free"].includes(s.studentType)) s.studentType = null;
  s.schoolExams = sanitizeSchoolExams(s.schoolExams);
  if (typeof s.guideSeen !== "boolean") s.guideSeen = false;
  LEGACY_SETTINGS_KEYS.forEach(k => { delete s[k]; });
  return s;
}

}

  const today = todayStr();

    // الأيام بين آخر فتح واليوم (دون الطرفين)، ولا يُعدّ منها يوم العطلة

    if (scheduledMissed >= 1){
      unplannedGap = gap - 1;            // مقدار الإزاحة: كل الأيام التقويمية الضائعة
      unplannedScheduledMissed = scheduledMissed; // ما يُعرض: أيام الدراسة الفائتة فعلاً

function weekKey(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const epoch = new Date("1970-01-01T00:00:00");
  const days = Math.floor((d - epoch) / 86400000);
  return Math.floor(days / 7);
}

function newCardsPerSession(dateStr){

}
function reviewCardsPerSession(dateStr){
